<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Student Portal</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link">Home</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">Students</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero Section -->

<div class="container my-5">

    <h1 class="text-center mb-5">
        Student Cards
    </h1>

    <div class="row">

        <!-- Student 1 -->

        <div class="col-md-3 mb-4">

            <div class="card student-card">

                <img src="https://picsum.photos/300?random=1" class="card-img-top">

                <div class="card-body text-center">

                    <h5>Rahul Sharma</h5>

                    <button
                    class="btn btn-primary"
                    onclick="showStudent(1)"
                    data-bs-toggle="collapse"
                    data-bs-target="#studentDetails">
                    View Details
                    </button>

                </div>

            </div>

        </div>

        <!-- Student 2 -->

        <div class="col-md-3 mb-4">

            <div class="card student-card">

                <img src="https://picsum.photos/300?random=2" class="card-img-top">

                <div class="card-body text-center">

                    <h5>Priya Verma</h5>

                    <button
                    class="btn btn-primary"
                    onclick="showStudent(2)"
                    data-bs-toggle="collapse"
                    data-bs-target="#studentDetails">
                    View Details
                    </button>

                </div>

            </div>

        </div>

        <!-- Student 3 -->

        <div class="col-md-3 mb-4">

            <div class="card student-card">

                <img src="https://picsum.photos/300?random=3" class="card-img-top">

                <div class="card-body text-center">

                    <h5>Aman Singh</h5>

                    <button
                    class="btn btn-primary"
                    onclick="showStudent(3)"
                    data-bs-toggle="collapse"
                    data-bs-target="#studentDetails">
                    View Details
                    </button>

                </div>

            </div>

        </div>

        <!-- Student 4 -->

        <div class="col-md-3 mb-4">

            <div class="card student-card">

                <img src="https://picsum.photos/300?random=4" class="card-img-top">

                <div class="card-body text-center">

                    <h5>Neha Gupta</h5>

                    <button
                    class="btn btn-primary"
                    onclick="showStudent(4)"
                    data-bs-toggle="collapse"
                    data-bs-target="#studentDetails">
                    View Details
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap Collapse -->

    <div class="collapse mt-4" id="studentDetails">

        <div class="card p-4">

            <h3 id="studentName"></h3>

            <p id="studentAge"></p>

            <p id="studentCourse"></p>

            <p id="studentEmail"></p>

            <p id="studentCity"></p>

        </div>

    </div>

</div>

<script src="script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
