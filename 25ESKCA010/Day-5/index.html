<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f8f9fa;
        }

        .hero{
            padding:60px 0;
        }

        .student-card{
            cursor:pointer;
            transition:0.3s;
        }

        .student-card:hover{
            transform:scale(1.05);
        }

        .student-img{
            height:220px;
            object-fit:cover;
        }
    </style>
</head>
<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="#">Student Portal</a>

        <button class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Students</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>

            </ul>

        </div>

    </div>
</nav>


<!-- Hero Section -->

<section class="hero">

<div class="container">

<h1 class="text-center mb-5">
Student Cards
</h1>

<div class="row g-4">

<!-- Student 1 -->

<div class="col-md-3">

<div class="card student-card"
onclick="showStudent(1)"
data-bs-toggle="collapse"
data-bs-target="#studentDetails">

<img src="https://randomuser.me/api/portraits/men/10.jpg"
class="card-img-top student-img">

<div class="card-body text-center">

<h5>Rahul Sharma</h5>

</div>

</div>

</div>


<!-- Student 2 -->

<div class="col-md-3">

<div class="card student-card"
onclick="showStudent(2)"
data-bs-toggle="collapse"
data-bs-target="#studentDetails">

<img src="https://randomuser.me/api/portraits/women/20.jpg"
class="card-img-top student-img">

<div class="card-body text-center">

<h5>Priya Singh</h5>

</div>

</div>

</div>


<!-- Student 3 -->

<div class="col-md-3">

<div class="card student-card"
onclick="showStudent(3)"
data-bs-toggle="collapse"
data-bs-target="#studentDetails">

<img src="https://randomuser.me/api/portraits/men/35.jpg"
class="card-img-top student-img">

<div class="card-body text-center">

<h5>Amit Verma</h5>

</div>

</div>

</div>


<!-- Student 4 -->

<div class="col-md-3">

<div class="card student-card"
onclick="showStudent(4)"
data-bs-toggle="collapse"
data-bs-target="#studentDetails">

<img src="https://randomuser.me/api/portraits/women/40.jpg"
class="card-img-top student-img">

<div class="card-body text-center">

<h5>Neha Gupta</h5>

</div>

</div>

</div>

</div>


<!-- Details Section -->

<div class="collapse mt-5" id="studentDetails">

<div class="card">

<div class="card-body">

<h3 id="name"></h3>

<p id="course"></p>

<p id="age"></p>

<p id="email"></p>

<p id="city"></p>

</div>

</div>

</div>

</div>

</section>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>

function showStudent(number){

var name=document.getElementById("name");
var course=document.getElementById("course");
var age=document.getElementById("age");
var email=document.getElementById("email");
var city=document.getElementById("city");

if(number==1){

name.innerHTML="Rahul Sharma";
course.innerHTML="Course : B.Tech CSE";
age.innerHTML="Age : 19 Years";
email.innerHTML="Email : rahul@gmail.com";
city.innerHTML="City : Jaipur";

}

if(number==2){

name.innerHTML="Priya Singh";
course.innerHTML="Course : BCA";
age.innerHTML="Age : 20 Years";
email.innerHTML="Email : priya@gmail.com";
city.innerHTML="City : Delhi";

}

if(number==3){

name.innerHTML="Amit Verma";
course.innerHTML="Course : B.Tech AI";
age.innerHTML="Age : 21 Years";
email.innerHTML="Email : amit@gmail.com";
city.innerHTML="City : Mumbai";

}

if(number==4){

name.innerHTML="Neha Gupta";
course.innerHTML="Course : B.Sc IT";
age.innerHTML="Age : 19 Years";
email.innerHTML="Email : neha@gmail.com";
city.innerHTML="City : Chandigarh";

}

}

</script>

</body>
</html>
