    <body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center mb-4">student card</h2>
        <input type="text"  id="searchInput" class="form-control mb-3" placeholder="search by name">
        <div id="container" class="row g-4"></div>
    </div>
    <script>
        const students=[
            {name:"ram",branch:"ai",cgpa:3.8},
            {name:"shyam",branch:"ece",cgpa:5.7},
            {name:"radha",branch:"ece",cgpa:9.0},
            {name:"akshat",branch:"ece",cgpa:8.9},

            {name:"rani",branch:"ai",cgpa:5.8},

        ];
                let html="";
                for(let i=0; i<students.length; i++){
                    html += `
                    <div class="col-md-4 card-item">
                                <div class="card shadow">
                                    <div class="card-body">
                                        <h4>${students[i].name}</h4>
                                        <button class="btn btn-primary btn-sm mt-2">
                                            show Details
                                        </button>

                                        <div class="details mt-3" style="display:none;">
                                            <p><strong>branch:</strong>${students[i].branch}</p>
                                            <p><strong>cgpa:</strong>${students[i].cgpa}</p>
                                        </div>
                                    </div>
                            </div>
                        </div>`;
                }
                    document.getElementById("container").innerHTML=html;
                    $(document).on("click",".btn",function(){
                        $(this).next(".details").slideToggle();
                    });
                    $("#searchInput").keyup(function(){
                        let value=$(this).val();
                        $(".card").each(function(){
                            let name=$(this).find("h4").text();
                            if(name.includes(value)){
    $(this).show();
}
                            });
                        });
                    document.getElementById("json").innerHTML = JSON.stringify(students, null, 2);
                    function replacer(key,value){
                        if(key === "cgpa"){
                            return undefined;
                        }
                        return value;
                    }



    </script>
