<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registration</title>
    <link rel="stylesheet" href="fs"/>

</head>
<body>
        <div class="container">
        <form class="form-box">
    <h1>Registration Form</h1>  
      <p>Please fill in this form</p>

    <label>
    Name:
    <input type="text" id="txtName" required 
    placeholder="Enter Your Name">
    </label>
    <label>
        Email:
        <input type="email" id="txtEmail" required 
        placeholder="Enter Your Email">
    </label>
    <div class="row">
        <div class="input-box">
        </div>
    <label>
        Phone Number:
        <input type="text" id="txtPhone" required 
        placeholder="Enter Your Phone Number">
    </label>
    <div class="gender">
        <input type="radio" id="check-male" name="gender" checked
        <label for="check-male">male</label>
        <input type="radio" id="check-Female" name="gender" checked
        <label for="check-female">female</label>
        <input type="radio" id="check-Transgender" name="gender" checked
        <label for="check-transgender">transgender</label>
        <input type="radio" id="check-other" name="gender" checked
        <label for="check-other"> Prefer Not To Say</label>
        </div>
<div class="input-box">
        <label for="dtDOB">Date of Birth:</label>
        <input type="date" id="dtDOB" name="dtDOB">
        </div>
<br>
<div class="row">
        <label for="pwdPASSWORD"> Password:</label>
        <input type="password" id="pwdPASSWORD" name="pwdPASSWORD"
        placeholder="Enter Your Password">
</div>
<br>
        <label for="pwdConfirmPassword"> Confirm Password:</label>
        <input type="password" id="pwdConfirmPassword" name="pwdConfirmPassword">


    <button type="submit">Submit</button>

</form>  
</body>
</html>
