<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional User Directory</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #eef4ff, #dbeafe, #f8fafc);
        }

        .user-card {
            transition: 0.3s;
        }

        .user-card:hover {
            transform: translateY(-8px);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid #0d6efd;
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <h2 class="mb-4">
            <i class="fa-solid fa-users text-primary"></i>
            Professional User Directory
        </h2>

        <input
            type="text"
            id="search"
            class="form-control mb-3"
            placeholder="Search">

        <!-- Loading Spinner -->
        <div id="loading" class="text-center">
            <div class="spinner-border"></div>
        </div>

        <!-- User Cards -->
        <div id="grid" class="row g-4 d-none"></div>

    </div>

    <script>

        // Indian Names
        const n = [
            "Rahul Sharma",
            "Priya Verma",
            "Arjun Singh",
            "Sneha Patel",
            "Rohan Gupta",
            "Ananya Kapoor",
            "Vikram Mehta",
            "Kavya Nair",
            "Aditya Joshi",
            "Neha Jain"
        ];

        // Professional Photos
        const p = [
            "https://randomuser.me/api/portraits/men/32.jpg",
            "https://randomuser.me/api/portraits/women/44.jpg",
            "https://randomuser.me/api/portraits/men/55.jpg",
            "https://randomuser.me/api/portraits/women/68.jpg",
            "https://randomuser.me/api/portraits/men/77.jpg",
            "https://randomuser.me/api/portraits/women/65.jpg",
            "https://randomuser.me/api/portraits/men/81.jpg",
            "https://randomuser.me/api/portraits/women/52.jpg",
            "https://randomuser.me/api/portraits/men/45.jpg",
            "https://randomuser.me/api/portraits/women/30.jpg"
        ];

        let u = [];

        fetch("https://jsonplaceholder.typicode.com/users")
            .then(r => r.json())
            .then(d => {

                u = d.map((x, i) => ({
                    ...x,
                    name: n[i],
                    avatar: p[i]
                }));

                loading.classList.add("d-none");
                grid.classList.remove("d-none");

                render();

            });

        function render() {

            let s = search.value.toLowerCase();

            grid.innerHTML = "";

            u.filter(x => x.name.toLowerCase().includes(s))
                .forEach(x => {

                    grid.innerHTML += `

                    <div class="col-md-3">

                        <div class="card user-card shadow p-3 text-center">

                            <img
                                class="avatar mx-auto mb-3"
                                src="${x.avatar}"
                                alt="${x.name}">

                            <span class="badge bg-success mb-2">
                                Online
                            </span>

                            <h5>${x.name}</h5>

                            <p>${x.company.name}</p>

                            <small>

                                ${x.email}

                                <br>

                                ${x.address.city}

                            </small>

                            <button class="btn btn-primary mt-3">

                                View Profile

                            </button>

                        </div>

                    </div>

                    `;

                });

        }

        search.oninput = render;

    </script>

</body>

</html>
