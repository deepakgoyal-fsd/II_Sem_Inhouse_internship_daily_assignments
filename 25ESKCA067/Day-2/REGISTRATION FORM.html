<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background-color: #f0f2f5;
        color: #333333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .email-container {
        max-width: 650px;
        width: 100%;
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        border: 1px solid #e1e5ea;
    }

    .header {
        background-color: #0056b3;
        color: #ffffff;
        padding: 30px;
        text-align: center;
    }

    .header h1 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
    }

    .header p {
        font-size: 14px;
        color: #e6f0fa;
    }

    .form-content {
        padding: 30px;
    }

    form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group.full-width {
        grid-column: span 2;
    }

    label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #555555;
        margin-bottom: 6px;
    }

    input, select {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #cfd4db;
        border-radius: 4px;
        font-size: 14px;
        color: #333333;
        background-color: #fafbfc;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #0056b3;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
    }

    input::placeholder {
        color: #999999;
    }

    button[type="submit"] {
        grid-column: span 2;
        background-color: #0056b3;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        padding: 14px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
        transition: background-color 0.2s ease;
    }

    button[type="submit"]:hover {
        background-color: #004494;
    }

    .footer {
        background-color: #f8f9fa;
        padding: 15px;
        text-align: center;
        font-size: 12px;
        color: #888888;
        border-top: 1px solid #e1e5ea;
    }

    @media (max-width: 600px) {
        form {
            grid-template-columns: 1fr;
        }
        .form-group.full-width {
            grid-column: span 1;
        }
        button[type="submit"] {
            grid-column: span 1;
        }
    }
</style>
</head>
<body>

<div class="email-container">
    <div class="header">
        <h1>Registration Form</h1>
        <p>Please complete your details below to proceed</p>
    </div>
    
    <div class="form-content">
        <form action="#" method="POST">
            <div class="form-group full-width">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group full-width">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@company.com" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected hidden>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" placeholder="e.g. Engineering" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
            </div>

            <button type="submit">Submit Details</button>
        </form>
    </div>
    
    <div class="footer">
        &copy; 2026 Your Organization. This is a secure system.
    </div>
</div>

</body>
</html>
