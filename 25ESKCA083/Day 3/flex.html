<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Layout</title>
    <link rel="stylesheet" href="flex.css">
</head>
<body>

    <div class="main-container">
        <div class="blocks-container">
            
            <div class="left-section">
                <div class="box pink-long"></div>
                <div class="left-bottom">
                    <div class="left-bottom-col">
                        <div class="box yellow-square"></div>
                        <div class="box orange-rect"></div>
                    </div>
                    <div class="box teal-tall"></div>
                </div>
            </div>

            <div class="right-section">
                <div class="right-top">
                    <div class="right-col-1">
                        <div class="box orange-rect-small"></div>
                        <div class="box teal-rect-small"></div>
                        <div class="box yellow-rect-small"></div>
                    </div>
                    <div class="right-col-2">
                        <div class="box teal-rect-med"></div>
                        <div class="box yellow-rect-med"></div>
                        <div class="box orange-rect-med"></div>
                    </div>
                </div>
                <div class="box pink-bottom-long"></div>
            </div>

        </div>

        <div class="footer-text">
            CSS FLEXBOX
        </div>
    </div>

</body>
</html>
