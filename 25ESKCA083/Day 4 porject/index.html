<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            position:relative;
            height: 100vh;
            margin:0;
        }
        img{
            width:100px;
            position: absolute;
            cursor:pointer;
        }

    </style>
</head>
<body>
        <p>banana:<span id="banana">0</span></p>
        <p>apple:<span id="apple">0</span></p>
        <img src="banana.png" onclick="clickimage('banana',this)">
        <img src="apple.png"  onclick="clickimage('apple',this)">
        <p>Time left: <span id="timer">10s</span></p>
        <button onclick="startGame()">Start Game</button>

        <script>
            let apple=0,banana=0;
            document.querySelectorAll("img").forEach(img=>{
                img.style.left=Math.random()*(window.innerWidth-100)+"px";
                img.style.top=Math.random()*(window.innerHeight-120)+"px";
            });
            function clickimage(type,img){
                if(type=="apple"){
                    document.getElementById("apple").innerText=++apple;
                }
                else{
                    document.getElementById("banana").innerText=++banana;
                }
                img.style.left=Math.random()*(window.innerWidth-100)+"px";
                img.style.top=Math.random()*(window.innerHeight-120)+"px";
                
            }
            
            function timer(){
                let timeLeft = 10;
                const timerElement = document.getElementById("timer");
                const countdown = setInterval(()=>{
                    timeLeft--;
                    timerElement.innerText = `${timeLeft}s`;
                    if(timeLeft <= 0){
                        clearInterval(countdown);
                        darkMode();
                        document.body.innerHTML += "<h2 style='color: white; text-align: center;margin-top: 50px;'>Game Over</h2>";
                        
                    }
                },1000);
            }


            function darkMode(){
                document.body.style.backgroundColor="black";
                document.body.style.color="white";
            }

            function startGame(){
                apple=0;
                banana=0;
                document.getElementById("apple").innerText=apple;
                document.getElementById("banana").innerText=banana;
                timer();
            }
        </script>

    </div>
</body>
</html>
