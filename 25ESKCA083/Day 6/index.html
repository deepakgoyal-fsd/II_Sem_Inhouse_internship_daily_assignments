<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Cards</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- JQUERY-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">Student Records</h1>
        <input type="text" id="search-input" class="form-control mb-4" placeholder="Search Students">
        <div id="container" class="row g-4"></div><br>
        <div class="row" id="student-cards-container"></div>
        <div id="json"></div>
            <!-- Student cards will be dynamically inserted here -->
    </div>

    <script>
        const students = [
            {name: "Gourav", Branch:"AI", cgpa: 9.8, photo:"apple.png"},
            {name: "Geetanjali", Branch:"AI", cgpa: 9.9, photo:"download.jpg"},
            {name: "Bheem", Branch: "AI", cgpa: 9.8, photo:"pineaple.png"},
            {name: "Daksh", Branch: "IT", cgpa: 9.8},
            {name: "Parth", Branch: "IT", cgpa: 9.8},
            {name: "Hitesh", Branch: "CSE", cgpa: 9.8},
            {name: "Peeyush", Branch: "AI", cgpa: 9.8},
            {name: "Vicky", Branch: "ECE", cgpa: 9.8},
            {name: "Amit", Branch: "ECE", cgpa: 9.8},
            {name: "Kirshan Tak", Branch: "IT", cgpa: 9.8},
        ];
        let html = "";
        for (let i = 0; i < students.length; i++) {
            html += `<div class="col-md-4 card-item">
                        <div class="card shadow">
                            <div class="card-body">
                                <img src=${students[i].photo} width="200px"> <br>
                                <h4>${students[i].name}</h4>
                                <button class="btn btn-primary btn-sm mt-2">Show Details</button>
                                <div class="details mt-3" style="display: none;">
                                    <p><strong>Branch:</strong> ${students[i].Branch}</p>
                                    <p><strong>CGPA:</strong> ${students[i].cgpa}</p>
                                </div>
                            </div>
                        </div>
                    </div>`;
        }
        document.getElementById("student-cards-container").innerHTML = html;
        $(document).on("click", ".btn", function() {
            $(this).next(".details").slideToggle();
        });
        
        $("#search-input").keyup(function(){
            let val = $(this).val().toLowerCase();
            $(".card-item").each(function(){
                let name = $(this).find("h4").text().toLowerCase();
                if(name.includes(val)){
                    $(this).show();
                } else {
                    $(this).hide();
                }
            });
        });

        document.getElementById("json").innerHTML=JSON.stringify(students, null,["name", "Branch", "cgpa"], 4);

        function replace(key, value){
            if (key == "cgpa"){
                return undefined;
            return value;
            }
        }
    </script>
    
</body>
</html>
