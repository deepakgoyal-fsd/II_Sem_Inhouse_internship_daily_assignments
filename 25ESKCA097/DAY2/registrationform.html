<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="stylesheet.css">
    
</head>      
<body id="body">
    
    <form> 
    <h1>Registration Form</h1>
    <div>
    <label  >
       Full Name:
        <br>
        <input type="text" id="txtName" required
        placeholder="Enter your name">        
    </label> 
    </div>   
 
    <label  >
        Email Address:
        <br>
        <input type="Email" id="txtEmail" required
        placeholder="Enter your email">        
    </label>    
    <br>
    
       <div id="PH">
 <label >
        Phone Number:
        <br>
        <input type="text" id="txtPhone" required
        placeholder="Enter your Phone Number">        
    </label> </div>    
    
    <div id="DOB">
<label  >
    DOB:
    <br>
     <input type="date" id="dtDOB" name="dtDOB" required >
    </label>  </div>  

    <br>

    <label  >
        Gender:
        <br>
        <input type="radio" id="a" name="gender" checked>
    <label for="check-male" >male</label>

     <input type="radio" id="b" name="gender" checked>
    <label for="check-female" >female</label>

     <input type="radio" id="c" name="gender" checked>
    <label for="check-transgender" >transgender</label>

     <input type="radio" id="d" name="gender" checked>
    <label for="check-other" >prefer not to say</label>
    
    </label>    
    
    <br>
   

     <label for="pwdpassword">
        Password:
        
    </label>
     <input type="password" id="pwdpassword" name="pwdpassword" placeholder="Password" required >
      
        
     
<br>

    <label for="pwdconfirmpassword" >Confirm Password:</label>
     <input type="password" id="pwdconfirmpassword" name="pwdconfirmpassword" placeholder="Confirm Password" required >


<br><br>
<input type="submit" id="button" value="submit" >


    </form>
    
    
</body>

</html>
