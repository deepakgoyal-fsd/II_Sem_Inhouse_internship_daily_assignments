<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Banana Game</title>
    <link rel="stylesheet" href="game.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            position: relative;
            height:100vh;
            margin:0;
            overflow:hidden;
            font-family:Arial, sans-serif;
        }

        p{
            font-size:22px;
            margin:10px;
        }

        img{
            width:100px;
            position:absolute;
            cursor:pointer;
        }
    </style>
</head>

<body>
<div class="hud">
    <p>Apple: <span id="apple">0</span></p>
    <p>Banana: <span id="banana">0</span></p>
    <p>Time: <span id="timer">02:00</span></p>
</div>

<div class="controls">
    <button id="startBtn" type="button">Start</button>
    <div id="status">Click Start to begin the game</div>
</div>

<img src="https://twemoji.maxcdn.com/v/latest/svg/1f34e.svg"
    alt="Apple"
    data-type="apple">

<img src="https://twemoji.maxcdn.com/v/latest/svg/1f34c.svg"
    alt="Banana"
    data-type="banana">

<script>

$(function () {
    let apple = 0;
    let banana = 0;
    let timeLeft = 120;
    let gameStarted = false;
    let timerId = null;

    const $timer = $("#timer");
    const $startBtn = $("#startBtn");
    const $status = $("#status");
    const $images = $("img");

    function randomPosition($img) {
        $img.css({
            left: Math.random() * (window.innerWidth - 100) + "px",
            top: Math.random() * (window.innerHeight - 120) + "px"
        });
    }

    $images.each(function () {
        randomPosition($(this));
        $(this).css({
            pointerEvents: "none",
            opacity: 0.5
        });
    });

    $startBtn.on("click", function () {
        if (gameStarted) {
            return;
        }

        gameStarted = true;
        $startBtn.prop("disabled", true).text("Game Running");
        $status.text("Game started! Click the fruits fast.");

        $images.css({
            pointerEvents: "auto",
            opacity: 1
        });

        timerId = setInterval(function () {
            timeLeft--;

            const minutes = String(Math.floor(timeLeft / 60)).padStart(2, "0");
            const seconds = String(timeLeft % 60).padStart(2, "0");
            $timer.text(minutes + ":" + seconds);

            if (timeLeft <= 0) {
                clearInterval(timerId);
                $status.text("Time's up! Apple: " + apple + ", Banana: " + banana);
                $images.css({
                    pointerEvents: "none",
                    opacity: 0.5
                });
                $startBtn.text("Finished");
            }
        }, 1000);
    });

    $images.on("click", function () {
        if (!gameStarted || timeLeft <= 0) {
            return;
        }

        const $img = $(this);
        const type = $img.data("type");

        if (type === "apple") {
            apple++;
            $("#apple").text(apple);
        } else {
            banana++;
            $("#banana").text(banana);
        }

        randomPosition($img);
    });
});

</script>

</body>
</html>
