<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live User Directory</title>


<!-- Bootstrap CDN -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
rel="stylesheet">


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container mt-4">


<h1 class="text-center mb-4">
🚀 Live User Directory
</h1>



<div class="row mb-3">

<div class="col-md-8">

<input 
type="text"
id="searchBox"
class="form-control"
placeholder="Search user by name">

</div>



<div class="col-md-4">

<button 
class="btn btn-primary w-100"
id="sortBtn">

Sort A-Z

</button>

</div>

</div>



<h5>
Total Users: 
<span class="badge bg-success" id="count">
0
</span>
</h5>


<div id="loading">

Loading Users...

</div>



<div class="row mt-3" id="userContainer">


</div>



</div>



<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


<script src="script.js"></script>


</body>
</html>
