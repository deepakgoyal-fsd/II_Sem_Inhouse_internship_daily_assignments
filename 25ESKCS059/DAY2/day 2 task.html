<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">
        <h1>Student Admission Form</h1>

        <form action="#" method="post">

            <label for="name">Full Name</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

            <label for="age">Age</label><br>
            <input type="number" id="age" name="age" placeholder="Enter your age" min="16" max="35" required><br><br>

            <label for="email">Email Address</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

            <label for="branch">Branch</label><br>
            <input type="text" id="branch" name="branch" placeholder="Enter your branch" required><br><br>

            <label for="tenth">10th Passing Year</label><br>
            <input type="number" id="tenth" name="tenth" placeholder="e.g. 2022" min="2000" max="2035" required><br><br>

            <label for="twelfth">12th Passing Year</label><br>
            <input type="number" id="twelfth" name="twelfth" placeholder="e.g. 2024" min="2000" max="2035" required><br><br>

            <label for="marksheet">Upload Marksheet</label><br>
            <input type="file" id="marksheet" name="marksheet" accept=".pdf,.jpg,.jpeg,.png" required><br><br>

            <button type="submit">Submit Form</button>

        </form>
    </div>

</body>
</html>
