<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <header style="color: red;">
        <h1>Registration Form</h1>
    </header>
    <form method="post" action="index.php" enctype="multipart/form-data">
        <hr>

        <label for="username">username:</label>
        <input type="text" id="username" placeholder="your name" minlength="3" maxlength="15" required><br>

        <label for="password">password:</label>
        <input type="password" id="password" required minlength="6" placeholder="--------"><br>
         
        <label for="email">email:</label>
        <input type="email" id="email" placeholder="abc@dmail.com" required><br>

        <label for="phone">phone no.</label>
        <input type="tel" id="phone" placeholder="1234567890" pattern="[0-9]{10}"><br>

        <label for="dob">DOB:</label>
        <input type="date" id="dob"><br>

         <label for="sem">semester:</label>
         <input type="number" id="sem" min="1" max="8"><br>

          <label for="gender" >Gender:</label>

           <label for="male">male</label>
           <input type="radio" id="male" value="male" name="gender" required>
           <label for="female">female</label>
           <input type="radio" id="female" value="female" name="gender" required><br>

           <label for="branch">Branch:</label>
           <select id="branch" required>
            <option value="">---</option>
            <option value="cse">cse</option>
            <option value="ece">ece</option>
            <option value="ai">ai</option>
            <option value="ml">ml</option>
           </select><br>

           <label for="internship">At internship:</label>
           <input type="checkbox" id="internship" ><br>

           <label for="comment">comment:</label>
           <textarea id="comment" rows="3" cols="25"></textarea><br>

           <label for="file">label:</label>
           <input type="file" id="file" accept="image/jpeg , image/png"><br><hr>
        <input type="submit"><br>
         <input type="reset">

    </form>
    
</body>
</html>
