<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="R F style.css">
</head>
<body>
        <h2>REGISTRATION FORM</h2>
 <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter Your Name" required><br><br>
        <label for="email">Email:</label>   
        <input type="email" id="email" name="email" placeholder="Enter Your Email" required><br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter Your Number" required><br><br>
         <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="gender">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br>
        <label for="DOB">DOB:</label>
        <input type="date" id="DOB" name="DOB" placeholder="Enter Your DOB" required><br><br>
        <label for="Department">Department:</label>
        <input type="text" id="Department" name="Department" placeholder="Enter Your Department" required><br><br>
        <label for="Address">Address:</label>
        <input type="text" id="Address" name="Address" placeholder="Enter Your Address" required><br><br>
        <label for="Hobbies">Hobbies:</label>
        <input type="checkbox" id="Hobbies" name="Hobbies" >
        <label for="Hobbies">Listening Music</label>
        <input type="checkbox" id="Travelling" name="Hobbies">
        <label for="Travelling">Travelling</label>
        <input type="checkbox" id="Sleeping" name="Hobbies">
        <label for="Sleeping">Sleeping</label><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder ="Enter Your Password"  required><br><br>
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Enter Confirm Password" required><br><br>
        <button >Submit</button>
    </form>
</body>
</html>
