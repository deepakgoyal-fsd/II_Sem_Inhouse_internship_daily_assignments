<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style7.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">🎓 Student Registration System</a>
    </div>
</nav>

<div class="container mt-5 mb-5">

<div class="card shadow-lg p-4 registration-card">

<h2 class="text-center text-primary mb-4">
Student Registration Form
</h2>

<form action="submit.php" method="POST" enctype="multipart/form-data">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Full Name
</label>

<input
type="text"
name="name"
class="form-control"
placeholder="Enter your full name"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Email
</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Password
</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter password"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Confirm Password
</label>

<input
type="password"
name="confirm_password"
class="form-control"
placeholder="Confirm password"
required>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Phone Number
</label>

<input
type="tel"
name="phone"
class="form-control"
placeholder="Enter phone number"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Date of Birth
</label>

<input
type="date"
name="dob"
class="form-control"
required>

</div>

</div>

<div class="mb-3">

<label class="form-label">
Gender
</label>

<div>

<input
type="radio"
name="gender"
value="Male">

Male

&nbsp;&nbsp;

<input
type="radio"
name="gender"
value="Female">

Female

&nbsp;&nbsp;

<input
type="radio"
name="gender"
value="Other">

Other

</div>

</div>

<div class="mb-3">

<label class="form-label">
Course
</label>

<select
class="form-select"
name="course">

<option value="">Select Course</option>

<option>BCA</option>

<option>B.Tech</option>

<option>BBA</option>

<option>B.Com</option>

<option>MCA</option>

<option>M.Tech</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Address
</label>

<textarea
class="form-control"
name="address"
rows="4"
placeholder="Enter your address"></textarea>

</div>

<div class="mb-3">

<label class="form-label">
Upload Profile Photo
</label>

<input
type="file"
class="form-control"
name="photo">

<div class="form-text">
Only UI is required for assignment.
</div>

</div>

<div class="form-check mb-4">

<input
class="form-check-input"
type="checkbox"
name="terms"
required>

<label class="form-check-label">

I agree to all Terms & Conditions

</label>

</div>

<div class="text-center">

<button
class="btn btn-primary btn-lg px-5">

Register

</button>

<button
type="reset"
class="btn btn-danger btn-lg px-5">

Reset

</button>

</div>

</form>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
