<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-5">

<div class="card shadow-lg">

<div class="card-header text-center header">
<h2><i class="fa-solid fa-user-graduate"></i> Student Registration Form</h2>
</div>

<div class="card-body">

<form action="result.php" method="POST">

<div class="mb-3">
<label class="form-label">Student Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Course</label>

<select class="form-select" name="course">
<option>BCA</option>
<option>B.Tech</option>
<option>B.Com</option>
<option>MCA</option>
<option>MBA</option>
</select>

</div>

<div class="mb-3">
<label class="form-label">Gender</label><br>

<input type="radio" name="gender" value="Male"> Male

<input type="radio" name="gender" value="Female"> Female

<input type="radio" name="gender" value="Other"> Other

</div>

<div class="mb-3">
<label class="form-label">Address</label>
<textarea class="form-control" name="address" rows="3"></textarea>
</div>

<div class="mb-3">
<label class="form-label">Student Photo</label>
<input type="file" class="form-control">
<small class="text-muted">UI only (No Upload Required)</small>
</div>

<button class="btn btn-success w-100">
<i class="fa-solid fa-paper-plane"></i> Register
</button>

</form>

</div>
</div>

</div>

</body>
</html>
