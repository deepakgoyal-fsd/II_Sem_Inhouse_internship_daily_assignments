<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fruit Clicker Game</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #f4f4f9;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }
        .scoreboard {
            background: white;
            padding: 10px;
            border-bottom: 2px solid #ccc;
            position: relative;
            z-index: 10;
        }
        img {
            position: absolute;
            cursor: pointer;
            transition: transform 0.1s ease;
            user-select: none;
            object-fit: contain;
        }
        img:active { transform: scale(0.9); }
        button {
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="scoreboard">
    <h2>Fruit Clicker</h2>
    <p>Apple: <span id="apple">0</span> | Banana: <span id="banana">0</span></p>
    <button onclick="resetGame()">Reset Game</button>
</div>


<img id="appleImg" src="https://openclipart.org" width="100" height="100" onclick="clickImage('apple', this)">
<img id="bananaImg" src="https://openclipart.org" width="100" height="100" onclick="clickImage('banana', this)">

<script>
let apple = 0;
let banana = 0;

function moveFruit(img) {
    const padding = 150;
    // फलों को स्क्रीन के साइज के अंदर ही रखने का लॉजिक
    const x = Math.random() * (window.innerWidth - padding);
    const y = padding + Math.random() * (window.innerHeight - padding - 50);
    img.style.left = x + "px";
    img.style.top = y + "px";
}


window.onload = () => {
    moveFruit(document.getElementById("appleImg"));
    moveFruit(document.getElementById("bananaImg"));
};

function clickImage(type, img) {
    if(type === "apple") {
        document.getElementById("apple").innerText = ++apple;
    } else {
        document.getElementById("banana").innerText = ++banana;
    }
    moveFruit(img);
}

function resetGame() {
    apple = 0;
    banana = 0;
    document.getElementById("apple").innerText = 0;
    document.getElementById("banana").innerText = 0;
    moveFruit(document.getElementById("appleImg"));
    moveFruit(document.getElementById("bananaImg"));
}
</script>

</body>
</html>
