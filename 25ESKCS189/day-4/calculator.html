<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; background: #fafafa; }
        .calc-box { display: inline-block; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #0e7c66; color: white; border: none; cursor: pointer; font-weight: bold; }
        button.clear-btn { background: #c0392b; }
        h3 { margin-top: 20px; color: #333; }
    </style>
</head>
<body>

<div class="calc-box">
    <h2>Simple Calculator</h2>
    <input type="number" id="number1" placeholder="First number">
    
    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input type="number" id="number2" placeholder="Second number">
    <br><br>
    <button onclick="calculate()">Calculate</button>
    <button class="clear-btn" onclick="clearFields()">Clear</button>

    <h3 id="result">Result: -</h3>
</div>

<script>
function calculate() {
    const number1 = parseFloat(document.getElementById("number1").value);
    const number2 = parseFloat(document.getElementById("number2").value);
    const operator = document.getElementById("operator").value;
    let result;

    if (isNaN(number1) || isNaN(number2)) {
        document.getElementById("result").innerText = "Please enter valid numbers.";
        return;
    }

    switch(operator) {
        case "+": result = number1 + number2; break;
        case "-": result = number1 - number2; break;
        case "*": result = number1 * number2; break;
        case "/": 
            result = (number2 === 0) ? "Cannot divide by zero" : number1 / number2; 
            break;
        default: result = "Invalid Operator";
    }

    document.getElementById("result").innerText = "Result: " + result;
}

function clearFields() {
    document.getElementById("number1").value = "";
    document.getElementById("number2").value = "";
    document.getElementById("operator").value = "+";
    document.getElementById("result").innerText = "Result: -";
}
</script> 

</body>
</html>
