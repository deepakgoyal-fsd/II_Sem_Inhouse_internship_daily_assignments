<!DOCTYPE html>
<html>
<head>
<title>SKIT College Registration Form</title>
<style>
body{
    background:rgb(149,57,57);
    padding:20px 450px;
}
.container{
    width:650px;background:white;padding:30px;border-radius:15px;box-shadow:0 0 15px gray;
}
.heading{text-align:center;color:#0b4f6c;margin-bottom:20px;}
.group{margin-bottom:15px;}
.label{display:block;margin-bottom:5px;font-weight:bold;}
.input{padding:10px;border:1px solid #ccc;border-radius:5px;font-size:15px;width:95%;}
.button{padding:12px;background:#2193b0;color:white;border:none;border-radius:5px;font-size:16px;cursor:pointer;margin-top:10px;}
.button:hover{background:#176d84;}
.dark{background:#222;}
.dark .container{background:#333;color:white;}
.dark .heading{color:#6fdcff;}
.dark .input{background:#555;color:white;border:1px solid white;}
</style>
</head>
<body>

<div class="container">
<center><img src="logo.png" width="90" height="90"></center>

<h2 class="heading">Swami Keshvanand Institute of Technology,<br>Management and Gramothan (SKIT)</h2>
<h3 class="heading">College Registration Form</h3>

<button type="button" class="button" id="darkBtn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
<br><br>

<form onsubmit="return validateForm();">

<div class="group"><label class="label">Student Name</label><input id="studentName" type="text" class="input"></div>
<div class="group"><label class="label">Father's Name</label><input id="fatherName" type="text" class="input"></div>
<div class="group"><label class="label">Mother's Name</label><input id="motherName" type="text" class="input"></div>
<div class="group"><label class="label">Student Phone Number</label><input id="studentPhone" type="tel" class="input"></div>
<div class="group"><label class="label">Age</label><input id="age" type="number" class="input"></div>

<div class="group">
<label class="label">Gender</label>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</div>

<div class="group">
<label class="label">Course</label>
<select class="input">
<option>Select Course</option>
<option>B.Tech</option>
<option>BCA</option>
<option>BBA</option>
<option>MBA</option>
</select>
</div>

<div class="group">
<input type="checkbox" id="agree"> I declare that the above information is true.
</div>

<button class="button" type="submit">Register</button>
<button class="button" type="reset">Reset</button>

</form>

<hr>
<h3 class="heading">Click Counter</h3>
<div style="text-align:center;">
<p>Total Clicks: <span id="count">0</span></p>
<button type="button" class="button" onclick="increaseCount()">Click Me</button>
<button type="button" class="button" onclick="resetCount()">Reset Counter</button>
</div>

</div>

<script>
function toggleDarkMode(){
 document.body.classList.toggle("dark");
 let btn=document.getElementById("darkBtn");
 btn.innerHTML=document.body.classList.contains("dark")?"☀️ Light Mode":"🌙 Dark Mode";
}

function validateForm(){
 let name=document.getElementById("studentName").value.trim();
 let father=document.getElementById("fatherName").value.trim();
 let mother=document.getElementById("motherName").value.trim();
 let phone=document.getElementById("studentPhone").value.trim();
 let age=document.getElementById("age").value.trim();
 let agree=document.getElementById("agree").checked;

 if(name==""){alert("Enter Student Name");return false;}
 if(father==""){alert("Enter Father's Name");return false;}
 if(mother==""){alert("Enter Mother's Name");return false;}
 if(!/^\d{10}$/.test(phone)){alert("Enter valid 10-digit phone number");return false;}
 if(age==""||age<16||age>30){alert("Enter valid age (16-30)");return false;}
 if(!agree){alert("Please accept the declaration.");return false;}
 alert("Registration Successful!");
 return true;
}

function increaseCount(){
 let c=document.getElementById("count");
 c.innerHTML=parseInt(c.innerHTML)+1;
}
function resetCount(){
 document.getElementById("count").innerHTML=0;
}

</script>
</body>
</html>
