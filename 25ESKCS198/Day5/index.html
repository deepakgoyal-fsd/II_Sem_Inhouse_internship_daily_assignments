<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory · jQuery</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom style (minor tweaks) -->
    <style>
        /* just a bit of polish */
        .hero {
            background: linear-gradient(145deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 2.5rem 0 2rem;
            border-bottom: 1px solid #dee2e6;
        }
        #studentTable tbody tr {
            transition: background-color 0.2s;
        }
        .highlight-row {
            background-color: #fff3cd !important;
        }
        .card-header h3 {
            margin: 0;
        }
        footer {
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }
        .btn-group-gap {
            gap: 0.5rem;
        }
        .btn-group-gap .btn {
            margin-right: 0.25rem;
        }
        #darkMode {
            transition: 0.2s;
        }
        .dark-mode {
            background-color: #1a1a2e !important;
            color: #e0e0e0 !important;
        }
        .dark-mode .hero {
            background: #16213e !important;
            border-bottom-color: #2a3a5e;
        }
        .dark-mode .card {
            background-color: #1e2a47 !important;
            border-color: #2e3f62;
        }
        .dark-mode .card-header {
            background-color: #0f3460 !important;
        }
        .dark-mode .table {
            color: #e0e0e0;
        }
        .dark-mode .table-dark {
            background-color: #0f1b33;
        }
        .dark-mode .table-bordered {
            border-color: #2e3f62;
        }
        .dark-mode .form-control {
            background-color: #2a3a5a;
            color: #f0f0f0;
            border-color: #3e5277;
        }
        .dark-mode .form-control::placeholder {
            color: #a0b0c8;
        }
        .dark-mode footer {
            background-color: #0d1b2a !important;
        }
    </style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-mortarboard-fill me-2"></i>Student Directory
        </a>
        <button class="btn btn-outline-light" id="darkMode" type="button">
            <i class="bi bi-moon-stars-fill me-1"></i> Dark Mode
        </button>
    </div>
</nav>

<!-- ================= HERO ================= -->
<section class="hero">
    <div class="container text-center">
        <h1 class="display-4 fw-bold"><i class="bi bi-people-fill me-3 text-primary"></i>Student Directory</h1>
        <p class="lead">Manage Student Records using jQuery <i class="bi bi-heart-fill text-danger ms-1"></i></p>
        <button class="btn btn-success btn-lg mt-3" id="welcomeBtn"><i class="bi bi-hand-thumbs-up me-2"></i>Welcome</button>
        <h3 id="message" class="mt-4 text-success fw-light"></h3>
    </div>
</section>

<!-- ================= FORM ================= -->
<div class="container mt-5">
    <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3><i class="bi bi-person-plus-fill me-2"></i>Add Student</h3>
            <span class="badge bg-light text-primary fs-6">required *</span>
        </div>
        <div class="card-body">
            <form id="studentForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold"><i class="bi bi-person"></i> Name</label>
                        <input type="text" class="form-control" id="name" placeholder="e.g. Aisha Khan" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold"><i class="bi bi-hash"></i> Roll No</label>
                        <input type="text" class="form-control" id="roll" placeholder="e.g. 101" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold"><i class="bi bi-book"></i> Course</label>
                        <input type="text" class="form-control" id="course" placeholder="e.g. B.Sc CS" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold"><i class="bi bi-geo-alt"></i> City</label>
                        <input type="text" class="form-control" id="city" placeholder="e.g. Mumbai" required>
                    </div>
                </div>
                <div class="mt-4 d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-success" id="addStudent"><i class="bi bi-plus-circle me-1"></i> Add Student</button>
                    <button type="button" class="btn btn-info text-white" id="slideBtn"><i class="bi bi-arrows-expand me-1"></i> Show / Hide Form</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ================= SEARCH + COUNT ================= -->
<div class="container mt-5">
    <div class="row align-items-center">
        <div class="col-md-6">
            <div class="input-group">
                <span class="input-group-text bg-primary text-white"><i class="bi bi-search"></i></span>
                <input type="text" id="search" class="form-control" placeholder="Search by name, course, city...">
            </div>
        </div>
        <div class="col-md-6 text-md-end mt-3 mt-md-0">
            <h4><i class="bi bi-people me-2"></i>Total Students : <span id="count" class="badge bg-primary rounded-pill fs-5">0</span></h4>
        </div>
    </div>
</div>

<!-- ================= ACTION BUTTONS ================= -->
<div class="container mt-4">
    <div class="d-flex flex-wrap btn-group-gap">
        <button class="btn btn-outline-danger" id="hideTable"><i class="bi bi-eye-slash me-1"></i> Hide Table</button>
        <button class="btn btn-outline-success" id="showTable"><i class="bi bi-eye me-1"></i> Show Table</button>
        <button class="btn btn-outline-warning" id="fadeBtn"><i class="bi bi-fade me-1"></i> Fade Table</button>
        <button class="btn btn-outline-primary" id="highlightBtn"><i class="bi bi-highlighter me-1"></i> Highlight Rows</button>
    </div>
</div>

<!-- ================= TABLE ================= -->
<div class="container mt-4">
    <table class="table table-bordered table-hover text-center align-middle" id="studentTable">
        <thead class="table-dark">
            <tr>
                <th><i class="bi bi-person"></i> Name</th>
                <th><i class="bi bi-hash"></i> Roll</th>
                <th><i class="bi bi-book"></i> Course</th>
                <th><i class="bi bi-geo-alt"></i> City</th>
                <th><i class="bi bi-trash3"></i> Delete</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- rows inserted by jQuery -->
        </tbody>
    </table>
</div>

<!-- ================= FOOTER ================= -->
<footer class="bg-dark text-white text-center p-3 mt-5">
    <h5 class="mb-0"><i class="bi bi-code-square me-2"></i>Student Directory Project using jQuery <i class="bi bi-heart-fill text-danger ms-2"></i></h5>
    <small class="text-light-emphasis">✨ just a bit of polish ✨</small>
</footer>


<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- Bootstrap JS (optional for some toggles) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ================ SCRIPT (jQuery) ================ -->
<script>
$(document).ready(function() {

    // ---------- initial sample data ----------
    const students = [
        { name: 'Arjun Reddy', roll: '101', course: 'B.Tech CSE', city: 'Hyderabad' },
        { name: 'Sneha Patel', roll: '102', course: 'B.Sc Maths', city: 'Ahmedabad' },
        { name: 'Rohan Mehta', roll: '103', course: 'B.Com', city: 'Mumbai' },
        { name: 'Kavya Nair', roll: '104', course: 'BBA', city: 'Delhi' }
    ];

    // ---------- helpers ----------
    function renderTable(dataArray) {
        const tbody = $('#tableBody');
        tbody.empty();
        if (!dataArray || dataArray.length === 0) {
            tbody.html('<tr><td colspan="5" class="text-muted fst-italic">No students found</td></tr>');
            $('#count').text(0);
            return;
        }
        $.each(dataArray, function(idx, s) {
            const row = `<tr>
                <td><i class="bi bi-person-circle me-1"></i>${s.name}</td>
                <td><span class="badge bg-secondary">${s.roll}</span></td>
                <td>${s.course}</td>
                <td><i class="bi bi-geo-alt-fill me-1 text-info"></i>${s.city}</td>
                <td><button class="btn btn-sm btn-outline-danger delete-btn" data-idx="${idx}"><i class="bi bi-x-circle"></i></button></td>
            </tr>`;
            tbody.append(row);
        });
        $('#count').text(dataArray.length);
        // re-bind delete events
        $('.delete-btn').off('click').on('click', function() {
            const idx = $(this).data('idx');
            students.splice(idx, 1);
            renderTable(students);
            // highlight removal effect
            $('#studentTable tbody tr').css('background', '#f8d7da').delay(200).queue(function() {
                $(this).css('background', '');
                $(this).dequeue();
            });
        });
    }

    // initial render
    renderTable(students);

    // ---------- add student ----------
    $('#studentForm').on('submit', function(e) {
        e.preventDefault();
        const name = $('#name').val().trim();
        const roll = $('#roll').val().trim();
        const course = $('#course').val().trim();
        const city = $('#city').val().trim();
        if (name && roll && course && city) {
            students.push({ name, roll, course, city });
            renderTable(students);
            // flash effect
            $('#studentTable tbody tr:last').css('background', '#d4edda').delay(300).queue(function() {
                $(this).css('background', '');
                $(this).dequeue();
            });
            // clear form
            $('#name, #roll, #course, #city').val('');
            // tiny feedback
            $('#message').text('✅ Student added!').fadeIn().delay(1200).fadeOut(400);
        } else {
            $('#message').text('⚠️ Please fill all fields.').css('color', '#dc3545').fadeIn().delay(1200).fadeOut(400);
        }
    });

    // ---------- slide form ----------
    $('#slideBtn').on('click', function() {
        $('.card-body').slideToggle(400);
        // change icon
        const icon = $(this).find('i');
        if (icon.hasClass('bi-arrows-expand')) {
            icon.removeClass('bi-arrows-expand').addClass('bi-arrows-collapse');
        } else {
            icon.removeClass('bi-arrows-collapse').addClass('bi-arrows-expand');
        }
    });

    // ---------- welcome button ----------
    $('#welcomeBtn').on('click', function() {
        $('#message').text('👋 Welcome to the Student Directory!').css('color', '#198754').fadeIn().delay(1500).fadeOut(500);
    });

    // ---------- search filter ----------
    $('#search').on('keyup', function() {
        const q = $(this).val().toLowerCase();
        const filtered = students.filter(s =>
            s.name.toLowerCase().includes(q) ||
            s.course.toLowerCase().includes(q) ||
            s.city.toLowerCase().includes(q) ||
            s.roll.toLowerCase().includes(q)
        );
        renderTable(filtered);
    });

    // ---------- hide / show table ----------
    $('#hideTable').on('click', function() {
        $('#studentTable').hide(300);
    });
    $('#showTable').on('click', function() {
        $('#studentTable').show(300);
    });

    // ---------- fade table ----------
    let faded = false;
    $('#fadeBtn').on('click', function() {
        if (!faded) {
            $('#studentTable').fadeOut(500);
            $(this).html('<i class="bi bi-fade me-1"></i> Fade In');
            faded = true;
        } else {
            $('#studentTable').fadeIn(500);
            $(this).html('<i class="bi bi-fade me-1"></i> Fade Table');
            faded = false;
        }
    });

    // ---------- highlight rows (toggle) ----------
    let highlightActive = false;
    $('#highlightBtn').on('click', function() {
        if (!highlightActive) {
            $('#studentTable tbody tr').addClass('highlight-row');
            $(this).html('<i class="bi bi-highlighter me-1"></i> Remove Highlight');
            highlightActive = true;
        } else {
            $('#studentTable tbody tr').removeClass('highlight-row');
            $(this).html('<i class="bi bi-highlighter me-1"></i> Highlight Rows');
            highlightActive = false;
        }
    });

    // ---------- dark mode ----------
    let dark = false;
    $('#darkMode').on('click', function() {
        if (!dark) {
            $('body').addClass('dark-mode');
            $(this).html('<i class="bi bi-sun-fill me-1"></i> Light Mode');
            dark = true;
        } else {
            $('body').removeClass('dark-mode');
            $(this).html('<i class="bi bi-moon-stars-fill me-1"></i> Dark Mode');
            dark = false;
        }
    });

    // ---------- extra: delete via row click (just for fun) but we have delete buttons ----------
    // (already handled)

    // initial message
    $('#message').text('✨ Ready! Add a student or search.').css('color', '#0d6efd').fadeIn().delay(1800).fadeOut(600);
});
</script>
</body>
</html>
