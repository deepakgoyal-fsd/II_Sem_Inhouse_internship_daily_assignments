<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promise</title>
</head>
<body>
    <script>
        let promise = new Promise(function (resolve, reject) {
            let internt = true;
            if (internt) {
                resolve("success");
            }
            else {
                reject("failed");
            }
        });
        promise.then(function (succes) {
            console.log("succes");
        }).catch(function (failed) {
            console.log("failed");
        })
        fetch("https://jsonplaceholder.typicode.com/users")
            .then(res => res.json())
            .then(data => {
                console.log(data);
            });
    </script>
</body>
</html>
