<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h2>check console for api data</h2>
    <script>
        fetch("https://jsonplaceholder.typicode.com/users")

        .catch(error => console.error(error));
    </script>
