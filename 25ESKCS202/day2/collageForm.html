<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Admission Form</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>SKIT Engineering College</h1>
<h3>Admission Form 2026</h3>

<form>

<div class="row">
<div class="input-box">
<label>Student Name</label>
<input type="text" placeholder="Enter Full Name">
</div>

<div class="input-box">
<label>Father Name</label>
<input type="text" placeholder="Enter Father Name">
</div>
</div>

<div class="row">
<div class="input-box">
<label>Mother Name</label>
<input type="text" placeholder="Enter Mother Name">
</div>

<div class="input-box">
<label>Email</label>
<input type="email" placeholder="Enter Email">
</div>
</div>

<div class="row">
<div class="input-box">
<label>Mobile Number</label>
<input type="tel" placeholder="Enter Mobile">
</div>

<div class="input-box">
<label>Date of Birth</label>
<input type="date">
</div>
</div>

<div class="row">
<div class="input-box">
<label>Gender</label>

<div class="gender">
<input type="radio" name="gender"> Male

<input type="radio" name="gender"> Female

<input type="radio" name="gender"> Other
</div>

</div>

<div class="input-box">
<label>Course</label>

<select>

<option>Select Course</option>

<option>CSE</option>

<option>AI</option>

<option>Data Science</option>

<option>IT</option>

<option>ECE</option>

</select>

</div>

</div>

<label>Address</label>

<textarea rows="4" placeholder="Enter Address"></textarea>

<div class="row">

<div class="input-box">

<label>10th Percentage</label>

<input type="number" placeholder="10th %">

</div>

<div class="input-box">

<label>12th Percentage</label>

<input type="number" placeholder="12th %">

</div>

</div>

<div class="row">

<div class="input-box">

<label>Student Photo</label>

<input type="file">

</div>

<div class="input-box">

<label>Aadhar Card</label>

<input type="file">

</div>

</div>

<input type="submit" value="Submit Application" class="btn">

</form>

</div>

</body>
</html>
