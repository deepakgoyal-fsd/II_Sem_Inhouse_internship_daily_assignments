<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Directory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><i class="fa-solid fa-graduation-cap"></i> Student Directory</div>
  <p class="tagline">Search, browse, and view full profiles — built with JS &amp; jQuery</p>
</header>

<main class="wrap">

  <!-- 1. Search Box -->
  <section class="search-panel">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search students by name...">
      <button id="clearSearch" class="clear-btn" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <p class="result-count"><span id="resultCount">0</span> students found</p>
  </section>

  <!-- 2. Student Cards (generated by JS) -->
  <section class="card-grid" id="cardGrid"></section>

  <p class="no-results" id="noResults">No students match "<span id="noResultsQuery"></span>".</p>

</main>

<!-- 3. Detail View Modal -->
<div class="overlay" id="overlay"></div>
<aside class="detail-panel" id="detailPanel">
  <button class="detail-close" id="detailClose" aria-label="Close profile"><i class="fa-solid fa-xmark"></i></button>

  <div class="detail-header">
    <div class="detail-avatar" id="detailAvatar"></div>
    <div>
      <h2 id="detailName"></h2>
      <p id="detailRole"></p>
    </div>
  </div>

  <div class="detail-stats">
    <div><span id="detailGpa"></span><label>GPA</label></div>
    <div><span id="detailYear"></span><label>Year</label></div>
    <div><span id="detailCredits"></span><label>Credits</label></div>
  </div>

  <!-- 4. Show / Hide toggle section -->
  <button class="toggle-info-btn" id="toggleInfoBtn">
    <span>More details</span><i class="fa-solid fa-chevron-down"></i>
  </button>

  <div class="extra-info" id="extraInfo">
    <div class="info-row"><i class="fa-solid fa-envelope"></i><span id="detailEmail"></span></div>
    <div class="info-row"><i class="fa-solid fa-phone"></i><span id="detailPhone"></span></div>
    <div class="info-row"><i class="fa-solid fa-location-dot"></i><span id="detailLocation"></span></div>
    <div class="info-row"><i class="fa-solid fa-book"></i><span id="detailBio"></span></div>
    <div class="skills-wrap" id="detailSkills"></div>
  </div>
</aside>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body>
</html>
