<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Registration Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#9b3f3f;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.container{
    width:800px;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.header{
    background:#8B0000;
    color:white;
    text-align:center;
    padding:20px;
}

.header img{
    width:90px;
    height:90px;
    object-fit:contain;
    background:white;
    border-radius:50%;
    padding:5px;
    margin-bottom:10px;
}

.header h2{
    margin-bottom:5px;
    font-size:28px;
}

.header p{
    font-size:17px;
}

form{
    padding:30px;
}

.row{
    display:flex;
    gap:20px;
    margin-bottom:18px;
}

.box{
    flex:1;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
    color:#8B0000;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border:2px solid #8B0000;
}

.gender{
    margin:10px 0 20px;
}

.gender input{
    width:auto;
    margin-right:5px;
}

.gender label{
    display:inline;
    color:#333;
    font-weight:normal;
    margin-right:20px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#8B0000;
    color:white;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#a40000;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <!-- Replace with your logo -->
        <img src="skit.jpg">

        <h2>Swami Keshvanand Institute of Technology</h2>
        <p>College Registration Form</p>

    </div>

    <form>

        <div class="row">

            <div class="box">
                <label>Student Name</label>
                <input type="text" placeholder="Enter Student Name">
            </div>

            <div class="box">
                <label>Father's Name</label>
                <input type="text" placeholder="Enter Father's Name">
            </div>

        </div>

        <div class="row">

            <div class="box">
                <label>Mother's Name</label>
                <input type="text" placeholder="Enter Mother's Name">
            </div>

            <div class="box">
                <label>Email Address</label>
                <input type="email" placeholder="Enter Email">
            </div>

        </div>

        <div class="row">

            <div class="box">
                <label>Student Phone</label>
                <input type="tel" placeholder="Enter Mobile Number">
            </div>

            <div class="box">
                <label>Parent's Phone</label>
                <input type="tel" placeholder="Enter Parent's Number">
            </div>

        </div>

        <div class="row">

            <div class="box">
                <label>Date of Birth</label>
                <input type="date">
            </div>

            <div class="box">
                <label>Age</label>
                <input type="number" placeholder="Enter Age">
            </div>

        </div>

        <div class="row">

            <div class="box">
                <label>Course</label>
                <select>
                    <option>Select Course</option>
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>BBA</option>
                    <option>MCA</option>
                    <option>MBA</option>
                </select>
            </div>

            <div class="box">
                <label>Branch</label>
                <select>
                    <option>Select Branch</option>
                    <option>CSE</option>
                    <option>AI & ML</option>
                    <option>ECE</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                </select>
            </div>

        </div>

        <label>Gender</label>

        <div class="gender">

            <input type="radio" id="male" name="gender">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender">
            <label for="other">Other</label>

        </div>

        <button type="submit">Register Now</button>

    </form>

</div>

</body>
</html>
