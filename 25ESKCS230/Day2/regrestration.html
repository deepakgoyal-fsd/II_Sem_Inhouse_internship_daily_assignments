<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: lightblue;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            background-color: white;
            padding: 30px;
            border: 2px solid blue;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: blue;
            margin-bottom: 20px;
        }

        label {
            color: blue;
            font-size: 18px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="radio"] {
            margin-right: 5px;
        }

        .gender {
            margin-bottom: 10px;
        }

        input[type="submit"] {
            width: 100%;
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <form>
        <h2>Registration Form</h2>

        <label>Name</label>
        <input type="text" name="name" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email">

        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="Enter your phone number">

        <label>Gender</label>
        <div class="gender">
            <input type="radio" id="male" name="gender" value="male">
            <label for="male" style="display:inline; color:black; font-size:16px; font-weight:normal;">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female" style="display:inline; color:black; font-size:16px; font-weight:normal;">Female</label>
        </div>

        <label>Date of Birth</label>
        <input type="date" name="dob">

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password">

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Confirm your password">

        <input type="submit" value="Submit">
        <ahref="day1.html">Homepage</a>.</p>
    </form>

</body>

</html>
