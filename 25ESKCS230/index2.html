<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFest 2026</title>

    <link rel="stylesheet" href="style.css">

    <!-- jQuery -->

<body>

    <div class="container">

                <p>24 Hour Coding Challenge</p>
            </div>

                <input type="text" id="college" placeholder="College Name" required>

                <input type="text" id="department" placeholder="Department" required>

                <input type="text" id="year" placeholder="Year" required>

                <input type="tel" id="phone" placeholder="Phone Number" maxlength="10" required>

                <input type="text" id="selectedEvent" placeholder="Selected Event" readonly>

                <label>
                    <input type="checkbox" id="agree">
                    I agree to the Terms & Conditions
                </label>

                <br><br>

                <button>Register</button>

            </form>
