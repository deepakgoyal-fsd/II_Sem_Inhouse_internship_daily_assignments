<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Live Photo Gallery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <nav class="navbar navbar-dark gallery-navbar">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="#"
            >

                <i class="fa-solid fa-images me-2"></i>

                Pixel Gallery

            </a>


            <span
                id="photo-count"
                class="badge count-badge"
            >

                0 Photos

            </span>

        </div>

    </nav>


    <section class="gallery-hero">

        <div class="container text-center">

            <div class="hero-camera">

                <i class="fa-solid fa-camera-retro"></i>

            </div>

            <h1 class="fw-bold mt-3">

                Explore Live Photos

            </h1>

            <p>

                A dynamic photo gallery
                powered by a live API.

            </p>

        </div>

    </section>


    <main class="container pb-5">

        <div class="search-card shadow-sm">

            <div class="input-group">

                <span class="input-group-text">

                    <i
                        class="
                            fa-solid
                            fa-magnifying-glass
                        "
                    ></i>

                </span>

                <input
                    type="text"
                    id="photo-search"
                    class="form-control"
                    placeholder="Search photos by title..."
                >

            </div>

        </div>


        <div
            id="photo-container"
            class="row g-4 mt-2"
        >
        </div>

    </main>


    <footer class="gallery-footer">

        <div class="container text-center">

            <p class="mb-0">

                <i class="fa-solid fa-code me-1"></i>

                Pixel Gallery |
                Day 6 Take-Home Assignment

            </p>

        </div>

    </footer>


    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
    ></script>

    <script src="script.js"></script>

</body>

</html>
