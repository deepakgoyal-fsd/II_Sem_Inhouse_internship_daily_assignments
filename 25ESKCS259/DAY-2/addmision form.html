<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        B.Tech Admission Form
    </title>
</head>

<body style="font-family:Arial,Helvetica,sans-serif;
             background:#eef4ff;
             color:#111827;
             margin:0;
             padding:32px;
             display:flex;
             justify-content:center;">

<main style="width:100%;
             max-width:760px;">

<form style="background:#ffffff;
             padding:32px;
             border-radius:14px;
             box-shadow:0 12px 35px rgba(0,0,0,0.08);">

<h1 style="text-align:center;
           color:#312e81;
           margin-top:0;">
B.Tech Admission Form
</h1>

<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Student Information</h2>

<div style="margin-bottom:16px;">
<label for="application" style="display:block;font-weight:600;margin-bottom:6px;">Application Number</label>
<input type="text" id="application" name="application" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="admission" style="display:block;font-weight:600;margin-bottom:6px;">Admission Number</label>
<input type="text" id="admission" name="admission" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="enrollment" style="display:block;font-weight:600;margin-bottom:6px;">Enrollment Number</label>
<input type="text" id="enrollment" name="enrollment" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="studentid" style="display:block;font-weight:600;margin-bottom:6px;">Student ID</label>
<input type="text" id="studentid" name="studentid" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="fullname" style="display:block;font-weight:600;margin-bottom:6px;">Full Name</label>
<input type="text" id="fullname" name="fullname" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="father" style="display:block;font-weight:600;margin-bottom:6px;">Father's Name</label>
<input type="text" id="father" name="father" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="mother" style="display:block;font-weight:600;margin-bottom:6px;">Mother's Name</label>
<input type="text" id="mother" name="mother" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="guardian" style="display:block;font-weight:600;margin-bottom:6px;">Guardian Name</label>
<input type="text" id="guardian" name="guardian" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="dob" style="display:block;font-weight:600;margin-bottom:6px;">Date of Birth</label>
<input type="date" id="dob" name="dob" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="mobile" style="display:block;font-weight:600;margin-bottom:6px;">Mobile Number</label>
<input type="tel" id="mobile" name="mobile" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="email" style="display:block;font-weight:600;margin-bottom:6px;">Email</label>
<input type="email" id="email" name="email" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Academic Details</h2>

<div style="margin-bottom:16px;">
<label for="course" style="display:block;font-weight:600;margin-bottom:6px;">Course</label>
<input type="text" id="course" name="course" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="branch" style="display:block;font-weight:600;margin-bottom:6px;">Branch</label>
<input type="text" id="branch" name="branch" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="session" style="display:block;font-weight:600;margin-bottom:6px;">Academic Session</label>
<input type="text" id="session" name="session" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="year" style="display:block;font-weight:600;margin-bottom:6px;">Admission Year</label>
<input type="number" id="year" name="year" placeholder="2026" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="semester" style="display:block;font-weight:600;margin-bottom:6px;">Semester</label>
<input type="number" id="semester" name="semester" placeholder="1" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="section" style="display:block;font-weight:600;margin-bottom:6px;">Section</label>
<input type="text" id="section" name="section" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="jee" style="display:block;font-weight:600;margin-bottom:6px;">JEE Main Roll Number</label>
<input type="text" id="jee" name="jee" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="rank" style="display:block;font-weight:600;margin-bottom:6px;">JEE Main Rank</label>
<input type="text" id="rank" name="rank" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="reap" style="display:block;font-weight:600;margin-bottom:6px;">REAP Merit Number</label>
<input type="text" id="reap" name="reap" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="mode" style="display:block;font-weight:600;margin-bottom:6px;">Admission Mode</label>
<input type="text" id="mode" name="mode" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Previous Qualifications</h2>

<div style="margin-bottom:16px;">
<label for="board10" style="display:block;font-weight:600;margin-bottom:6px;">10th Board</label>
<input type="text" id="board10" name="board10" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="cgpa10" style="display:block;font-weight:600;margin-bottom:6px;">10th Percentage / CGPA</label>
<input type="text" id="cgpa10" name="cgpa10" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="board12" style="display:block;font-weight:600;margin-bottom:6px;">12th Board</label>
<input type="text" id="board12" name="board12" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="pcm" style="display:block;font-weight:600;margin-bottom:6px;">12th PCM Percentage</label>
<input type="text" id="pcm" name="pcm" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="overall" style="display:block;font-weight:600;margin-bottom:6px;">12th Overall Percentage</label>
<input type="text" id="overall" name="overall" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="school" style="display:block;font-weight:600;margin-bottom:6px;">School Name</label>
<input type="text" id="school" name="school" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="passing" style="display:block;font-weight:600;margin-bottom:6px;">Passing Year</label>
<input type="number" id="passing" name="passing" placeholder="2026" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Address</h2>

<div style="margin-bottom:16px;">
<label for="address" style="display:block;font-weight:600;margin-bottom:6px;">Permanent Address</label>
<textarea id="address" name="address" rows="4" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;"></textarea>
</div>

<div style="margin-bottom:16px;">
<label for="city" style="display:block;font-weight:600;margin-bottom:6px;">City</label>
<input type="text" id="city" name="city" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="district" style="display:block;font-weight:600;margin-bottom:6px;">District</label>
<input type="text" id="district" name="district" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="state" style="display:block;font-weight:600;margin-bottom:6px;">State</label>
<input type="text" id="state" name="state" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>

<div style="margin-bottom:16px;">
<label for="pin" style="display:block;font-weight:600;margin-bottom:6px;">PIN Code</label>
<input type="number" id="pin" name="pin" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;">
</div>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Facilities</h2>
<div style="margin-bottom:10px;"><label><input type="checkbox" style="width:auto;"> Hostel Required</label></div>
<div style="margin-bottom:10px;"><label><input type="checkbox" style="width:auto;"> Transport Required</label></div>
<div style="margin-bottom:10px;"><label><input type="checkbox" style="width:auto;"> Scholarship Applied</label></div>
<div style="margin-bottom:10px;"><label><input type="checkbox" style="width:auto;"> Fee Paid</label></div>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Documents Submitted</h2>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Passport Size Photograph</label><input type="file" style="width:100%;"></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Signature</label><input type="file" style="width:100%;"></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">10th Marksheet</label><input type="file" style="width:100%;"></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">12th Marksheet</label><input type="file" style="width:100%;"></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Transfer Certificate</label><input type="file" style="width:100%;"></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Migration Certificate</label><input type="file" style="width:100%;"></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Character Certificate</label><input type="file" style="width:100%;"></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Aadhaar Card</label><input type="file" style="width:100%;"></div>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Declaration</h2>

<div style="margin-bottom:20px;">
<label><input type="checkbox" required style="width:auto;"> I declare that all the information provided above is true and correct.</label>
</div>

<div style="display:flex;justify-content:flex-end;gap:12px;">
<button type="reset" style="padding:12px 22px;border:none;border-radius:10px;background:#e5e7eb;cursor:pointer;">Reset</button>
<button type="submit" style="padding:12px 22px;border:none;border-radius:10px;background:#4f46e5;color:#fff;cursor:pointer;">Submit Application</button>
</div>

</form>
</main>
</body>
</html>
