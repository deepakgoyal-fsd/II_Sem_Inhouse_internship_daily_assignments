<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>
        B.Tech Admission Form
    </title>
</head>
<body style="font-family:Arial,Helvetica,sans-serif;
             background:#eef4ff;
             color:#111827;
             margin:0;
             padding:32px;
             display:flex;
             justify-content:center;">
<main style="width:100%;
             max-width:760px;">
<form style="background:#ffffff;
             padding:32px;
             border-radius:14px;
             box-shadow:0 12px 35px rgba(0,0,0,0.08);">
<h1 style="text-align:center;
           color:#312e81;
           margin-top:0;">
B.Tech Admission Form
</h1>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Student Information</h2>
<div style="margin-bottom:16px;">
<label for="application" style="display:block;font-weight:600;margin-bottom:6px;">Application Number</label>
<input id="application" name="application" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="admission" style="display:block;font-weight:600;margin-bottom:6px;">Admission Number</label>
<input id="admission" name="admission" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="enrollment" style="display:block;font-weight:600;margin-bottom:6px;">Enrollment Number</label>
<input id="enrollment" name="enrollment" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="studentid" style="display:block;font-weight:600;margin-bottom:6px;">Student ID</label>
<input id="studentid" name="studentid" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="fullname" style="display:block;font-weight:600;margin-bottom:6px;">Full Name</label>
<input id="fullname" name="fullname" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="father" style="display:block;font-weight:600;margin-bottom:6px;">Father's Name</label>
<input id="father" name="father" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="mother" style="display:block;font-weight:600;margin-bottom:6px;">Mother's Name</label>
<input id="mother" name="mother" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="guardian" style="display:block;font-weight:600;margin-bottom:6px;">Guardian Name</label>
<input id="guardian" name="guardian" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="dob" style="display:block;font-weight:600;margin-bottom:6px;">Date of Birth</label>
<input id="dob" name="dob" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="date"/>
</div>
<div style="margin-bottom:16px;">
<label for="mobile" style="display:block;font-weight:600;margin-bottom:6px;">Mobile Number</label>
<input id="mobile" name="mobile" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="tel"/>
</div>
<div style="margin-bottom:16px;">
<label for="email" style="display:block;font-weight:600;margin-bottom:6px;">Email</label>
<input id="email" name="email" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="email"/>
</div>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Academic Details</h2>
<div style="margin-bottom:16px;">
<label for="course" style="display:block;font-weight:600;margin-bottom:6px;">Course</label>
<input id="course" name="course" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="branch" style="display:block;font-weight:600;margin-bottom:6px;">Branch</label>
<input id="branch" name="branch" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="session" style="display:block;font-weight:600;margin-bottom:6px;">Academic Session</label>
<input id="session" name="session" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="year" style="display:block;font-weight:600;margin-bottom:6px;">Admission Year</label>
<input id="year" name="year" placeholder="2026" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="number"/>
</div>
<div style="margin-bottom:16px;">
<label for="semester" style="display:block;font-weight:600;margin-bottom:6px;">Semester</label>
<input id="semester" name="semester" placeholder="1" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="number"/>
</div>
<div style="margin-bottom:16px;">
<label for="section" style="display:block;font-weight:600;margin-bottom:6px;">Section</label>
<input id="section" name="section" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="jee" style="display:block;font-weight:600;margin-bottom:6px;">JEE Main Roll Number</label>
<input id="jee" name="jee" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="rank" style="display:block;font-weight:600;margin-bottom:6px;">JEE Main Rank</label>
<input id="rank" name="rank" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="reap" style="display:block;font-weight:600;margin-bottom:6px;">REAP Merit Number</label>
<input id="reap" name="reap" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="mode" style="display:block;font-weight:600;margin-bottom:6px;">Admission Mode</label>
<input id="mode" name="mode" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Previous Qualifications</h2>
<div style="margin-bottom:16px;">
<label for="board10" style="display:block;font-weight:600;margin-bottom:6px;">10th Board</label>
<input id="board10" name="board10" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="cgpa10" style="display:block;font-weight:600;margin-bottom:6px;">10th Percentage / CGPA</label>
<input id="cgpa10" name="cgpa10" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="board12" style="display:block;font-weight:600;margin-bottom:6px;">12th Board</label>
<input id="board12" name="board12" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="pcm" style="display:block;font-weight:600;margin-bottom:6px;">12th PCM Percentage</label>
<input id="pcm" name="pcm" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="overall" style="display:block;font-weight:600;margin-bottom:6px;">12th Overall Percentage</label>
<input id="overall" name="overall" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="school" style="display:block;font-weight:600;margin-bottom:6px;">School Name</label>
<input id="school" name="school" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="passing" style="display:block;font-weight:600;margin-bottom:6px;">Passing Year</label>
<input id="passing" name="passing" placeholder="2026" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="number"/>
</div>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Address</h2>
<div style="margin-bottom:16px;">
<label for="address" style="display:block;font-weight:600;margin-bottom:6px;">Permanent Address</label>
<textarea id="address" name="address" rows="4" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;"></textarea>
</div>
<div style="margin-bottom:16px;">
<label for="city" style="display:block;font-weight:600;margin-bottom:6px;">City</label>
<input id="city" name="city" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="district" style="display:block;font-weight:600;margin-bottom:6px;">District</label>
<input id="district" name="district" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="state" style="display:block;font-weight:600;margin-bottom:6px;">State</label>
<input id="state" name="state" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label for="pin" style="display:block;font-weight:600;margin-bottom:6px;">PIN Code</label>
<input id="pin" name="pin" placeholder="" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="number"/>
</div>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Facilities</h2>
<div style="margin-bottom:10px;"><label><input style="width:auto;" type="checkbox"/> Hostel Required</label></div>
<div style="margin-bottom:10px;"><label><input style="width:auto;" type="checkbox"/> Transport Required</label></div>
<div style="margin-bottom:10px;"><label><input style="width:auto;" type="checkbox"/> Scholarship Applied</label></div>
<div style="margin-bottom:10px;"><label><input style="width:auto;" type="checkbox"/> Fee Paid</label></div>
<h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Documents Submitted</h2>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Passport Size Photograph</label><input style="width:100%;" type="file"/></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Signature</label><input style="width:100%;" type="file"/></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">10th Marksheet</label><input style="width:100%;" type="file"/></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">12th Marksheet</label><input style="width:100%;" type="file"/></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Transfer Certificate</label><input style="width:100%;" type="file"/></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Migration Certificate</label><input style="width:100%;" type="file"/></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Character Certificate</label><input style="width:100%;" type="file"/></div>
<div style="margin-bottom:14px;"><label style="display:block;font-weight:600;margin-bottom:6px;">Aadhaar Card</label><input style="width:100%;" type="file"/></div>
<div style="margin-bottom:16px;">
<label for="confirmPassword" style="display:block;font-weight:600;margin-bottom:6px;">Confirm Password</label>
<input id="confirmPassword" name="confirmPassword" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="password"/>
<div style="margin-top:8px;">
<label><input id="showPassword" type="checkbox"/> Show Passwords</label>
</div>
</div><div style="margin-bottom:16px;">
<label for="password" style="display:block;font-weight:600;margin-bottom:6px;">Portal Password</label>
<input id="password" name="password" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" type="password"/>
</div><h2 style="margin-top:28px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;color:#374151;">Declaration</h2>
<div style="margin-bottom:20px;">
<label><input required="" style="width:auto;" type="checkbox"/> I declare that all the information provided above is true and correct.</label>
</div>
<div style="display:flex;justify-content:flex-end;gap:12px;">
<button style="padding:12px 22px;border:none;border-radius:10px;background:#e5e7eb;cursor:pointer;" type="reset">Reset</button>
<button style="padding:12px 22px;border:none;border-radius:10px;background:#4f46e5;color:#fff;cursor:pointer;" type="submit">Submit Application</button>
</div>
</form>
</main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const form=document.querySelector('form');

function error(el,msg){
 let e=el.parentElement.querySelector('.js-error');
 if(!e){
   e=document.createElement('div');
   e.className='js-error';
   e.style.cssText='color:#dc2626;font-size:12px;margin-top:4px;';
   el.parentElement.appendChild(e);
 }
 e.textContent=msg;
 el.style.border='2px solid #dc2626';
}
function clearErr(el){
 const e=el.parentElement.querySelector('.js-error');
 if(e)e.textContent='';
 el.style.border='1px solid #22c55e';
}
function req(id,name){
 const el=document.getElementById(id);
 if(!el.value.trim()){error(el,name+' is required');return false;}
 clearErr(el);return true;
}
document.querySelectorAll('input,textarea').forEach(el=>{
 el.addEventListener('input',()=>{if(el.value.trim())clearErr(el);});
});

form.addEventListener('submit',e=>{
 e.preventDefault();
 let ok=true;

 ['application','fullname','father','mother','dob','course','branch','address','city','state'].forEach(id=>{
   if(!req(id,id.replace(/^[a-z]/,c=>c.toUpperCase()))) ok=false;
 });

 const mobile=document.getElementById('mobile');
 if(!/^\d{10}$/.test(mobile.value)){error(mobile,'Enter a valid 10-digit mobile');ok=false;} else clearErr(mobile);

 const email=document.getElementById('email');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)){error(email,'Invalid email');ok=false;} else clearErr(email);

 const pin=document.getElementById('pin');
 if(!/^\d{6}$/.test(pin.value)){error(pin,'PIN must be 6 digits');ok=false;} else clearErr(pin);

 const year=document.getElementById('year');
 if(year.value && (+year.value<2000 || +year.value>2100)){error(year,'Invalid admission year');ok=false;} else clearErr(year);

 const sem=document.getElementById('semester');
 if(sem.value && (+sem.value<1 || +sem.value>8)){error(sem,'Semester must be 1-8');ok=false;} else clearErr(sem);

 ['cgpa10','pcm','overall'].forEach(id=>{
   const el=document.getElementById(id);
   if(el.value){
     const v=parseFloat(el.value);
     if(isNaN(v)||v<0||v>100){error(el,'Enter value between 0 and 100');ok=false;}
     else clearErr(el);
   }
 });

 const files=form.querySelectorAll('input[type=file]');
 files.forEach(f=>{
   if(f.files.length===0){f.style.outline='2px solid #dc2626';ok=false;}
   else f.style.outline='2px solid #22c55e';
 });

 const dec=form.querySelector('input[type=checkbox][required]');
 if(!dec.checked){alert('Please accept the declaration.');ok=false;}

 if(ok){
   alert('Application validated successfully! Ready for submission.');
   form.reset();
   form.querySelectorAll('input,textarea').forEach(i=>{i.style.border='';i.style.outline='';});
 }
});
});


// Password validation + show password
const pwd=document.getElementById('password');
const cpwd=document.getElementById('confirmPassword');
const show=document.getElementById('showPassword');

if(show){
 show.addEventListener('change',()=>{
   const t=show.checked?'text':'password';
   pwd.type=t;
   cpwd.type=t;
 });
}

function strength(v){
 let s=0;
 if(v.length>=8)s++;
 if(/[A-Z]/.test(v))s++;
 if(/[a-z]/.test(v))s++;
 if(/[0-9]/.test(v))s++;
 if(/[^A-Za-z0-9]/.test(v))s++;
 return s;
}

pwd.insertAdjacentHTML('afterend','<div id="pwdStrength" style="font-size:12px;margin-top:4px;"></div>');
const meter=document.getElementById('pwdStrength');

pwd.addEventListener('input',()=>{
 const sc=strength(pwd.value);
 const txt=['Very Weak','Weak','Fair','Good','Strong','Excellent'][sc];
 const cols=['#dc2626','#ea580c','#eab308','#3b82f6','#16a34a','#15803d'];
 meter.textContent='Strength: '+txt;
 meter.style.color=cols[sc];
});

form.addEventListener('submit',e=>{
 let valid=true;
 if(pwd.value.length<8){
   error(pwd,'Password must be at least 8 characters');
   valid=false;
 }
 if(pwd.value!==cpwd.value){
   error(cpwd,'Passwords do not match');
   valid=false;
 }
 if(!valid)e.preventDefault();
});
</script></body>
</html>
