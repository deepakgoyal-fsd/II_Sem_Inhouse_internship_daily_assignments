<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            width:350px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            color:#333;
            margin-bottom:10px;
        }

        h2{
            color:#555;
            margin:20px 0 10px;
        }

        ul{
            list-style:none;
        }

        li{
            margin:8px 0;
            color:#666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rajat Sharma</h1>
        <p>Computer Science Student</p>

        <h2>My Hobbies</h2>

        <ul>
            <li>💻 Coding</li>
            <li>📚 Learning New Technologies</li>
            <li>🎵 Listening to Music</li>
            <li>🎮 Gaming</li>
            <li>📖 Reading Books</li>
        </ul>
    </div>

</body>
</html>
