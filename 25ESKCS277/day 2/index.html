<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f2f2f2;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .container{
        background:#fff;
        padding:30px;
        width:400px;
        border-radius:8px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h2{
        text-align:center;
        margin-bottom:20px;
    }

    label{
        display:block;
        margin-top:12px;
        font-weight:bold;
    }

    input,
    select,
    textarea{
        width:100%;
        padding:10px;
        margin-top:5px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    textarea{
        resize:none;
    }

    .gender{
        margin-top:8px;
    }

    .gender label{
        display:inline;
        font-weight:normal;
        margin-right:15px;
    }

    button{
        width:100%;
        padding:12px;
        margin-top:20px;
        border:none;
        background:#007bff;
        color:white;
        font-size:16px;
        border-radius:5px;
        cursor:pointer;
    }

    button:hover{
        background:#0056b3;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Student Registration Form</h2>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter your phone number" required>

        <label>Date of Birth</label>
        <input type="date" required>

        <label>Gender</label>
        <div class="gender">
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>

            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
        </div>

        <label>Course</label>
        <select required>
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>B.Sc</option>
            <option>BBA</option>
        </select>

        <label>Address</label>
        <textarea rows="4" placeholder="Enter your address"></textarea>

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
