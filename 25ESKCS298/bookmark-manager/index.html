<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookmarkManager - Access Hub</title>
    
    <!-- Meta Descriptions for SEO -->
    <meta name="description" content="Secure and elegant bookmark manager. Organize your favorite links, URLs, and pages in categories (Work, Personal, Study).">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <div class="auth-wrapper">
        <!-- Auth Card -->
        <div class="auth-card glass-card fade-transition" id="auth-card-container">
            
            <!-- Login Form Section -->
            <div id="login-section">
                <div class="auth-header">
                    <div class="auth-logo"><i class="bi bi-bookmark-star-fill me-2"></i>Bookmark Manager</div>
                    <div class="auth-subtitle">Welcome back! Please sign in to continue</div>
                </div>
                
                <form id="login-form">
                    <div class="mb-4">
                        <label for="login-identifier" class="form-label text-secondary small fw-semibold">Username or Email</label>
                        <input type="text" class="form-control form-control-custom" id="login-identifier" placeholder="Enter username or email" required autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label for="login-password" class="form-label text-secondary small fw-semibold">Password</label>
                        </div>
                        <input type="password" class="form-control form-control-custom" id="login-password" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                    <button type="submit" id="login-submit-btn" class="btn btn-primary-gradient w-100 py-3 mt-2">
                        <span>Sign In</span>
                        <div class="spinner-border spinner-border-sm ms-2 d-none" id="login-spinner" role="status"></div>
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <span class="text-muted">Don't have an account?</span>
                    <a class="auth-toggle-link ms-1" id="link-to-register">Create Account</a>
                </div>
            </div>

            <!-- Registration Form Section (Hidden initially) -->
            <div id="register-section" class="d-none">
                <div class="auth-header">
                    <div class="auth-logo"><i class="bi bi-bookmark-star-fill me-2"></i>Bookmark Manager</div>
                    <div class="auth-subtitle">Create an account to start organizing links</div>
                </div>
                
                <form id="register-form">
                    <div class="mb-3">
                        <label for="register-username" class="form-label text-secondary small fw-semibold">Username</label>
                        <input type="text" class="form-control form-control-custom" id="register-username" placeholder="Choose a username" required minlength="3" maxlength="30" autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label for="register-email" class="form-label text-secondary small fw-semibold">Email Address</label>
                        <input type="email" class="form-control form-control-custom" id="register-email" placeholder="name@example.com" required autocomplete="email">
                    </div>
                    <div class="mb-3">
                        <label for="register-password" class="form-label text-secondary small fw-semibold">Password</label>
                        <input type="password" class="form-control form-control-custom" id="register-password" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="mb-4">
                        <label for="register-confirm-password" class="form-label text-secondary small fw-semibold">Confirm Password</label>
                        <input type="password" class="form-control form-control-custom" id="register-confirm-password" placeholder="Verify password" required autocomplete="new-password">
                    </div>
                    <button type="submit" id="register-submit-btn" class="btn btn-primary-gradient w-100 py-3">
                        <span>Create Account</span>
                        <div class="spinner-border spinner-border-sm ms-2 d-none" id="register-spinner" role="status"></div>
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <span class="text-muted">Already have an account?</span>
                    <a class="auth-toggle-link ms-1" id="link-to-login">Sign In</a>
                </div>
            </div>

        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Frontend JS Controller -->
    <script src="js/app.js"></script>
</body>
</html>
