
1<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Admission Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 100px;
    }
    .form-container {
      background: #fff; padding: 25px;
      border-radius: 15px; width: 400px;
      box-shadow: 5px 20px 20px rgba(0, 0, 0, 0.233);
    }
    h2 { text-align: center; color: #0d47a1; margin-bottom: 20px; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    input, textarea {
      width: 100%; padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc; border-radius: 6px;
      font-size: 12px; box-sizing: border-box;
    }
    input:focus, textarea:focus {
      border-color: #1976d2; outline: none;
      box-shadow: 0 0 5px rgba(25,118,210,0.3);
    }
    .skills{
    margin: 10px 0 20px;
}


.skills label{
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0;
    font-weight: normal;
}

.skills input[type="checkbox"]{
    width: auto;
    margin: 0;
}
    button:hover { background: #0d47a1; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>College Admission Form</h2>
    <form>
      <label>Full Name</label>
      <input type="text" required>

      <label>Email</label>
      <input type="email" required>

      <label>Password</label>
      <input type="password" required>

      <label>Mobile Number</label>
      <input type="tel" required>

      <label>Date of Birth</label>
      <input type="date" required>

      <label>Skills</label>
      <div class="skills">
        <label><input type="checkbox"> HTML</label>
        <label><input type="checkbox"> CSS</label>
        <label><input type="checkbox"> JavaScript</label>
        <label><input type="checkbox"> PHP</label>
      </div>

      <label>Upload Resume</label>
      <input type="file" required>

      <label>About Yourself</label>
      <textarea rows="5"></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
