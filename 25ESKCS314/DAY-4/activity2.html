<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.big-switch{
    width:3rem;
    height:1.6rem;
    cursor:pointer;
}
</style>
</head>
<h1>Welcome!!</h1>
<body data-bs-theme="light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container-fluid">

<a class="navbar-brand" href="#">MySite</a>

<ul class="navbar-nav ms-auto d-flex flex-row align-items-center">

<li class="nav-item">
<a class="nav-link text-white" href="#">Home</a>
</li>

<li class="nav-item">
<a class="nav-link text-white" href="#">About</a>
</li>

<li class="nav-item">
<a class="nav-link text-white" href="#">Contact</a>
</li>

<li class="nav-item dropdown ms-2">
<button class="btn btn-dark" data-bs-toggle="dropdown">&#8942;</button>

<ul class="dropdown-menu dropdown-menu-end">
<li><a class="dropdown-item" href="#">Profile</a></li>
<li><a class="dropdown-item" href="#">Settings</a></li>
<li><a class="dropdown-item" href="#">Logout</a></li>
</ul>
</li>

<li class="nav-item ms-4 me-2">
<div class="form-check form-switch">
<input class="form-check-input big-switch" type="checkbox" id="themeSwitch">
<label class="form-check-label text-white ms-2" for="themeSwitch">
Dark Mode
</label>
</div>
</li>

</ul>

</div>
</nav>

<div class="container text-center mt-5">
<h2>Click Counter</h2>

<h3 id="count">0</h3>

<button class="btn btn-primary" onclick="increaseCount()">Click Me</button>
<button class="btn btn-danger" onclick="resetCount()">Reset</button>
</div>

<div class="container mt-5">

<h2>Form Validation</h2>

<form onsubmit="return validateForm()">

<div class="mb-3">
<label>Name</label>
<input type="text" class="form-control" id="name">
<small id="nameError" class="text-danger"></small>
</div>

<div class="mb-3">
<label>Email</label>
<input type="text" class="form-control" id="email">
<small id="emailError" class="text-danger"></small>
</div>

<button class="btn btn-success" type="submit">Submit</button>

</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

let count = 0;

function increaseCount() {
    count++;
    document.getElementById("count").innerHTML = count;
}

function resetCount() {
    count = 0;
    document.getElementById("count").innerHTML = count;
}

const themeSwitch = document.getElementById("themeSwitch");

themeSwitch.onchange = function () {
    document.body.setAttribute("data-bs-theme", this.checked ? "dark" : "light");

};

function validateForm(){

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;

document.getElementById("nameError").innerHTML = "";
document.getElementById("emailError").innerHTML = "";

let valid = true;

if(name == ""){
    document.getElementById("nameError").innerHTML = "Name is required";
    valid = false;
}

if(!email.includes("@")){
    document.getElementById("emailError").innerHTML = "Enter a valid email";
    valid = false;
}

return valid;
}
</script>
</body>
</html>
