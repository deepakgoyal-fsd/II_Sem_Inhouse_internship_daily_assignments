<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Registration form</title>

    <style>

        body{
            background-color: #e6f7ff;
            font-family: Arial, Helvetica;
        }

        .form-box{
            width: 700px;
            background: white;
            margin: 50px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }
        h2{
            text-align: centre;
           
         color: blue;
        }
        label{
            font-wiegth: bold;
        
        }

        input, select{
            width: 500px;
            padding: 8px;
            margin: 2px;
            border: 1px solid gray;
            box-sizing: border-box;
            text-align: center;
    

        }
        input[type="radio"]{
            width: auto;

        }
        input[type="submit"]:hover{
            background: pink;

        }


    </style>
</head>
<body>

    <div class="form-box">

    <h2>SCHOOL REGISTRATION FORM</h2>
    <form>
       <label>Student Name</label><br>
       <input type="text" placeholder="Enter name"><br><br>

       <label>Father's Name</label><br>
       <input type="text" placeholder="Enter name"><br><br>
       <label>Email</label><br>
       <input type="email" placeholder="Enter Email"><br><br>

       <label>Gender</label><br>
       <input type="radio" placeholder="gender"> MALE<br>
       <input type="radio" placeholder="gender"> FEMALE <br><br>


       <label>Select Class</label><br>
       <select>
        <option>Select class</option>
        <option>Class 1</option>
        <option>Class 2</option>
        <option>Class 3</option>
        <option>Class 4</option>
        <option>Class 5</option><br><br>
       </select><br><br>

       <input type="submit" placement="Register">



    </form>
    </div>

    <script>
const form = document.querySelector(".login-form");
const submitBtn = document.querySelector('input[type="submit"]');

// Create greeting text
const greeting = document.createElement("p");
document.querySelector('input[type="text"]').after(greeting);

// Input Event
document.querySelector('input[type="text"]').addEventListener("input", function () {
    greeting.textContent = "Hello, " + this.value + "!";
});

// Click Event
submitBtn.addEventListener("click", function () {
    console.log("Submit button clicked");
});

// Submit Event
form.addEventListener("submit", function (e) {
    e.preventDefault();

    const name = document.querySelector('input[type="text"]').value;
    const email = document.querySelector('input[type="email"]').value;
    const phone = document.querySelector('input[type="tel"]').value;
    const password = document.querySelectorAll('input[type="password"]')[0].value;
    const confirmPassword = document.querySelectorAll('input[type="password"]')[1].value;

    if (name === "" || email === "" || phone === "") {
        alert("Please fill all the required fields.");
        return;
    }

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    alert("Registration Successful!");

    form.reset();
    greeting.textContent = "";
});
</script>

</body>
</html>
