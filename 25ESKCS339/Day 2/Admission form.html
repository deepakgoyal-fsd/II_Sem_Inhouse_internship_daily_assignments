<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
</head>
<body bgcolor="chocolaty">
    <h1><center>Admission Form</center></h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
<label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required><br><br>
        <label for="blood_group">Blood Group:</label>
        <input type="text" id="blood_group" name="blood_group" required><br><br>
        <label for="caste">Caste:</label>
        <input type="text" id="cast" name="cast" required><br><br>
        <label for="father_name">Father's Name:</label>
        <input type="text" id="father_name" name="father_name" required><br><br>
        <label for="mother_name">Mother's Name:</label>
        <input type="text" id="mother_name" name="mother_name" required><br><br>
        <label for="father_occupation">Father's Occupation:</label>
        <input type="text" id="father_occupation" name="father_occupation" required><br><br>
        <label for="mother_occupation">Mother's Occupation:</label>
        <input type="text" id="mother_occupation" name="mother_occupation" required><br><br>
        <label for="father_income">Father's Income:</label>
        <input type="number" id="father_income" name="father_income" required><br><br>
        <label for="mother_income">Mother's Income:</label>
        <input type="number" id="mother_income" name="mother_income" required><br><br>
        <label for ="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required><br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="female">Female:</label>
        <input type="radio" id="female" name="gender" value="female" required><br><br>
        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" cols="50" required></textarea><br><br>
        <label for="city">City:</label>
        <input type="text" id="city" name="city" required><br><br>
        <label for="state">State:</label>
        <input type="text" id="state" name="state" required><br><br>
        <label for="pin">pin Code:</label>
        <input type="text" id="pin" name="pin" required><br><br>
        <label for="country">Country:</label>
        <input type="text" id="country" name="country" required><br><br>
        <label for="nationality">Nationality:</label>
        <input type="text" id="nationality" name="nationality" required><br><br>
        <label for="religion">Religion:</label>
        <input type="text" id="religion" name="religion" required><br><br>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
        </select><br><br>
<label for ="10th markseet ">10th Marksheet:</label>
        <input type="file" id="10th markseet " name="10th markseet " required><br><br>
    <label for ="12th markseet">12th markseet: </label>
    <input type ="file" id="12th markseet:" name="12th markseet" required><br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
