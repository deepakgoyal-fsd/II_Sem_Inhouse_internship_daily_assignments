<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="/style.css">

</head>
<body>
  
    

  

    <form class="form">
    

    <h1>Registration Form</h1>
    
      


    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" placeholder="Enter full name" />

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="Enter email address" />

    <div class="row">
      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter phone number" />
      </div>
      <div class="field">
        <label for="dob">Birth Date</label>
        <input type="date" id="dob" />
      </div>
    </div>

    <!-- Gender -->
    <label>Gender</label>
    <div class="radio-group">
      <label>
        <input type="radio" name="gender" value="male" checked /> Male
      </label>
      <label>
        <input type="radio" name="gender" value="female" /> Female
      </label>
      <label>
        <input type="radio" name="gender" value="others" /> Others
      </label>
    </div>

    <!-- Address -->
    <p class="section-label">Address</p>
    <input type="text" placeholder="Enter street address" style="margin-bottom: 8px;" />
    <input type="text" placeholder="Enter street address line 2" style="margin-bottom: 8px;" />

    <div class="row">
      <div class="field">
        <select>
          <option value="">Country</option>
          <option>India</option>
          <option>USA</option>
          <option>UK</option>
          <option>Canada</option>
          <option>Australia</option>
        </select>
      </div>
      <div class="field">
        <input type="text" placeholder="Enter your city" />
      </div>
    </div>

    <div class="row" style="margin-top: 8px;">
      <div class="field">
        <input type="text" placeholder="Enter your region" />
      </div>
      <div class="field">
        <input type="text" placeholder="Enter postal code" />
      </div>
    </div>

    <!-- Submit -->
    <button class="btn-submit">Submit</button>
  </div>
    
</body>
</html>
