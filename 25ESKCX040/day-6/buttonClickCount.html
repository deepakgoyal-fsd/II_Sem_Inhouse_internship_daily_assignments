<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Click Counter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-dark text-white">
    <div class="text-center">
        <h2>Button Click Counter</h2>
        <h1 id="counter" class="display-1 my-3">0</h1>
        <button id="clickBtn" class="btn btn-warning btn-lg">Click Me!</button>
        <button id="resetBtn" class="btn btn-outline-danger btn-sm ms-2">Reset</button>
    </div>

    <script>
        let count = 0;
        const counterDisplay = document.getElementById('counter');
        
        document.getElementById('clickBtn').addEventListener('click', () => {
            count++;
            counterDisplay.innerText = count;
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            count = 0;
            counterDisplay.innerText = count;
        });
    </script>
</body>
</html>
