<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Cards from JSON</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="text-center mb-4 text-primary">Student Directory (Day 6)</h2>
        <div class="text-center mb-4">
            <button id="loadBtn" class="btn btn-success btn-lg">Fetch Student Data</button>
        </div>

        <!-- Yahan par saare cards dynamic load honge -->
        <div id="cardContainer" class="row g-4"></div>
    </div>

    <script>
        document.getElementById('loadBtn').addEventListener('click', fetchStudents);

        function fetchStudents() {
            // j.json file se data fetch ho raha hai
            fetch('j.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response mein dikkat hai');
                    }
                    return response.json();
                })
                .then(data => {
                    const container = document.getElementById('cardContainer');
                    container.innerHTML = ''; // Pehle se agar kuch ho toh clear karne ke liye

                    // Loop chalakar har ek student ka card banana
                    data.forEach(student => {
                        const cardHtml = `
                            <div class="col-md-4">
                                <div class="card h-100 shadow-sm">
                                    <div class="card-body">
                                        <h5 class="card-title text-dark">${student.name}</h5>
                                        <h6 class="card-subtitle mb-2 text-muted">Roll No: ${student.rollNo}</h6>
                                        <p class="card-text">
                                            <strong>Branch:</strong> ${student.branch}<br>
                                            <strong>Email:</strong> ${student.email}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += cardHtml;
                    });
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    alert('Data  not load !');
                });
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
