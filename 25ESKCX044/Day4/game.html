<!DOCTYPE html>
<html>
<head>
    <title>Fruit Click Game</title>
    <link rel="stylesheet" href="game.css">

    <style>
        body{
            margin:0;
            overflow:hidden;
            background:#89d7dc;
        }

        h2{
            text-align:center;
        }

        img{
            width:100px;
            height:100px;
            position:absolute;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h2>
Apple: <span id="apple">0</span>
&nbsp;&nbsp;&nbsp;
Banana: <span id="banana">0</span>
</h2>

<img src="https://images.steamusercontent.com/ugc/1815523882969362418/8646323B9517788D16266E77265E9BC4DD708376/?imw=512&&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false"
id="appleImg"
onclick="clickImage('apple',this)">

<img src="https://preview.redd.it/day-4-of-learning-trying-sculpt-methods-added-a-jaw-and-v0-75hbdek68pzc1.png?width=640&crop=smart&auto=webp&s=21d84986e0afd5e0a4d6b8a0aabf0a00a29607f4"
id="bananaImg"
onclick="clickImage('banana',this)">

<script>

let apple=0;
let banana=0;

// Place both images randomly
document.querySelectorAll("img").forEach(img=>{
    randomPosition(img);
});

function randomPosition(img){

    img.style.left=Math.random()*(window.innerWidth-120)+"px";

    img.style.top=Math.random()*(window.innerHeight-150)+"px";
}

function clickImage(type,img){

    if(type=="apple"){
        apple++;
        document.getElementById("apple").innerText=apple;
    }
    else{
        banana++;
        document.getElementById("banana").innerText=banana;
    }

    // Move image after click
    randomPosition(img);

}

</script>

</body>
</html>
