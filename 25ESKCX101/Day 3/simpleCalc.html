<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><i>Simple Calculator</i></h1>
    <form action="">
        <label > Number 1: <input type="text" id="number1" placeholder="Enter first number"/></label>
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
       </select>
        <label> Number 2:
            <input type="text" id="number2" placeholder="Enter second number"/>
        </label>
        <br>
        <button type="button" onclick="arithematicOperation()">Perform Arithematic operation</button>
        <div id="result"></div>
    </form>

   <script src="arithematic.js"></script>
</body>
</html>
