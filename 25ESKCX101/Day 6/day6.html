<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center mb-4">Students Records</h2>
        <input type="text" id="search" class="form-control mb-3" placeholder="Search Students">
        <div id="container" class="row g-4"></div>
    </div>
    <div id="json"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
     const students = [
          {name: "Saksham", branch: "CSE", cgpa: 9.9},
          {name: "Tanuj", branch: "CSE", cgpa: 9.0},
          {name: "Prashant", branch: "CSE", cgpa: 8.5},
          {name: "Naitik", branch: "CSE", cgpa: 8.0},
          {name: "Swastik", branch: "CSE", cgpa: 9.5},
          {name: "Ankit", branch: "CSE", cgpa: 7.0},
     ]

         
     let html = "";
     for(let i=0 ; i<students.length ; i++){
        html += `
         <div class="col-md-4 card-item">
            <div class="card shadow">
                <div class="card-body">
                    <h4>${students[i].name}</h4>
                    <button class="btn btn-primary btn-sm mt-2">Show Details</button>

                    <div class="details mt-3" style="display: none;">
                        <p><strong>Branch:</strong> ${students[i].branch}</p>
                        <p><strong>CGPA:</strong> ${students[i].cgpa}</p>
                </div>
            </div>
        </div>
        </div>
        `;
     }
     document.getElementById("container").innerHTML = html;

     $(document).ready(function () {
        // show details
        $(".btn-primary").on("click", function () {
            $(this).next(".details").toggle();
        });

        // search students by name, branch, or cgpa
        $("#search").on("keyup", function () {
            let val = $(this).val().toLowerCase().trim();

            $(".card-item").each(function () {
                let cardText = $(this).text().toLowerCase();
                $(this).toggle(cardText.includes(val));
            });
        });
     });
 

     document.getElementById("json").innerHTML = JSON.stringify(students,  replacer,4);

     // 3 . replacer
     function replacer(key, value){
        if(key === "cgpa"){
            return undefined;
        }
        return value;
     }
    
    </script>
  </body>
</html>
