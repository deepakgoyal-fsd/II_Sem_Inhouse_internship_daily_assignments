<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Registration Form</h1>

<div class="form">

<form>

<label>Full Name</label><br>
<input type="text" placeholder="Enter Full Name"><br><br>

<label>Email</label><br>
<input type="email" placeholder="Enter Email"><br><br>

<label>Phone Number</label><br>
<input type="number" placeholder="Enter Phone Number"><br><br>

<label>Birth Date</label><br>
<input type="date"><br><br>

<label>Gender</label><br>

<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other

<br><br>

<label>Address</label><br>
<textarea rows="4" cols="35" placeholder="Enter Address"></textarea>

<br><br>

<label>City</label><br>
<input type="text" placeholder="Enter City"><br><br>

<label>State</label><br>
<input type="text" placeholder="Enter State"><br><br>

<label>Postal Code</label><br>
<input type="text" placeholder="Enter Postal Code"><br><br>

<input type="submit" value="Register">
<input type="reset" value="Reset">

</form>

</div>

</body>
</html>
