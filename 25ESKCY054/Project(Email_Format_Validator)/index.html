<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Format Validator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="glass-card">

            <h1>Email Format Validator</h1>

            <p class="subtitle">
                Enter your email below to verify whether it follows a valid email format.
            </p>

            <form id="emailForm" novalidate>

                <!-- Email Input -->

                <div class="mb-4">

                    <label class="form-label">
                        Email Address
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope-fill"></i>
                        </span>

                        <input
                            type="text"
                            id="email"
                            class="form-control"
                            placeholder="example@gmail.com">

                    </div>

                    <small id="validationMessage"></small>

                </div>

                <!-- Email Strength -->

                <div class="strength-section">

                    <div class="d-flex justify-content-between">

                        <span>Email Quality</span>

                        <span id="strengthText">
                            Waiting...
                        </span>

                    </div>

                    <div class="progress mt-2">

                        <div
                            id="strengthBar"
                            class="progress-bar"
                            role="progressbar"
                            style="width:0%">
                        </div>

                    </div>

                </div>

                <!-- Tips -->

                <div class="tips">

                    <h5>
                        Valid Email Rules
                    </h5>

                    <ul>

                        <li>Contains one @ symbol</li>

                        <li>Username before @</li>

                        <li>Domain after @</li>

                        <li>Ends with a valid extension (.com, .in, .org, etc.)</li>

                    </ul>

                </div>

                <!-- Buttons -->

                <div class="button-group">

                    <button
                        type="submit"
                        id="submitBtn"
                        class="btn btn-success"
                        disabled>

                        <i class="bi bi-check-circle-fill"></i>

                        Validate

                    </button>

                    <button
                        type="reset"
                        class="btn btn-outline-light"
                        id="resetBtn">

                        <i class="bi bi-arrow-clockwise"></i>

                        Reset

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
