<!DOCTYPE html>
<html>
<head>
    <title>College Registration Form</title>

    <style>
        body{
            background:#e6f4ff;
            font-family:Arial, sans-serif;
            transition:0.4s;
        }

        .container{
            width:550px;
            background:white;
            border:2px solid #1a73e8;
            border-radius:10px;
            padding:25px;
            margin-top:40px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            transition:0.4s;
        }

        .dark{
            background:#121212;
            color:white;
        }

        .dark .container{
            background:#1f1f1f;
            border:2px solid #4da6ff;
            color:white;
        }

        .dark input,
        .dark textarea,
        .dark select{
            background:#333;
            color:white;
            border:1px solid #777;
        }

        #darkBtn{
            position:fixed;
            top:15px;
            right:15px;
            padding:10px 18px;
            border:none;
            background:#1a73e8;
            color:white;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
        }
    </style>
</head>

<body>

<button id="darkBtn" onclick="toggleDarkMode()">🌙 Dark Mode</button>

<center>

<div class="container">

<h2 style="color:#1a73e8;">
College Registration Form
</h2>

<form id="myForm">

<table cellpadding="10">

<tr>
<td><b>First Name</b></td>
<td><input type="text" id="fname" placeholder="Enter First Name" style="width:250px;"></td>
</tr>

<tr>
<td><b>Last Name</b></td>
<td><input type="text" id="lname" placeholder="Enter Last Name" style="width:250px;"></td>
</tr>

<tr>
<td><b>Email</b></td>
<td><input type="email" id="email" placeholder="Enter Email" style="width:250px;"></td>
</tr>

<tr>
<td><b>Gender</b></td>
<td>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
<input type="radio" name="gender" value="Other"> Other
</td>
</tr>

<tr>
<td><b>Date of Birth</b></td>
<td><input type="date" id="dob" style="width:250px;"></td>
</tr>

<tr>
<td><b>Phone</b></td>
<td><input type="tel" id="phone" placeholder="Enter Phone Number" style="width:250px;"></td>
</tr>

<tr>
<td><b>Course</b></td>
<td>
<select id="course" style="width:258px;">
<option value="">-- Select Course --</option>
<option>B.Tech</option>
<option>B.Sc</option>
<option>B.Com</option>
<option>B.A</option>
</select>
</td>
</tr>

<tr>
<td><b>Address</b></td>
<td>
<textarea rows="4" cols="34" id="address" placeholder="Enter Address"></textarea>
</td>
</tr>

<tr>
<td><b>Country</b></td>
<td>
<select id="country" style="width:258px;">
<option value="">-- Select Country --</option>
<option>India</option>
<option>USA</option>
<option>Canada</option>
<option>Australia</option>
</select>
</td>
</tr>

<tr>
<td></td>
<td>
<input type="checkbox" id="terms"> I agree to Terms & Conditions
</td>
</tr>

<tr>
<td colspan="2" align="center">

<input
type="submit"
value="Register"
style="background:#1a73e8;color:white;padding:8px 20px;border:none;border-radius:5px;cursor:pointer;">

<input
type="reset"
value="Clear"
style="padding:8px 20px;margin-left:10px;border-radius:5px;">

</td>
</tr>

</table>

</form>

</div>

</center>

<script>

function toggleDarkMode(){

document.body.classList.toggle("dark");

let btn=document.getElementById("darkBtn");

if(document.body.classList.contains("dark")){
btn.innerHTML="☀ Light Mode";
}
else{
btn.innerHTML="🌙 Dark Mode";
}

}

document.getElementById("myForm").addEventListener("submit",function(e){

e.preventDefault();

let fname=document.getElementById("fname").value.trim();
let lname=document.getElementById("lname").value.trim();
let email=document.getElementById("email").value.trim();
let dob=document.getElementById("dob").value;
let phone=document.getElementById("phone").value.trim();
let course=document.getElementById("course").value;
let address=document.getElementById("address").value.trim();
let country=document.getElementById("country").value;
let terms=document.getElementById("terms").checked;

let gender=document.querySelector('input[name="gender"]:checked');

if(fname==""){
alert("Please enter First Name.");
return;
}

if(lname==""){
alert("Please enter Last Name.");
return;
}

if(email==""){
alert("Please enter Email.");
return;
}

if(!gender){
alert("Please select Gender.");
return;
}

if(dob==""){
alert("Please select Date of Birth.");
return;
}

if(phone==""){
alert("Please enter Phone Number.");
return;
}

if(course==""){
alert("Please select Course.");
return;
}

if(address==""){
alert("Please enter Address.");
return;
}

if(country==""){
alert("Please select Country.");
return;
}

if(!terms){
alert("Please agree to the Terms & Conditions.");
return;
}

alert("Registration Successful!");

});

</script>

</body>
</html>
