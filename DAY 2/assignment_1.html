<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <form>
      <img src="https://png.pngtree.com/png-vector/20230423/ourlarge/pngtree-student-login-blue-gradient-concept-icon-thin-resource-icon-vector-png-image_51465858.jpg" width=200px hight=100px>
      
   
   
    

    
         <div class="container">
    <h1>REGISTRATION FORM</h1>
    

        <label>Name:</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email"><br><br>

        <label>Phone:</label><br>
        <input type="tel" placeholder="Enter your phone number"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        <label>Date of Birth:</label><br>
        <input type="date"><br><br>

        <label>Documents:</label><br>
        <input type="text" placeholder="Enter your documents"><br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Enter password"><br><br>

        <label>Confirm Password:</label><br>
        <input type="password" placeholder="Confirm password"><br><br>

        <button type="submit">submit</button>
        <button type="reset">reset</button>

    </form>
    </div>

</body>
</html>
