<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Admission Form</title>
<link rel="stylesheet" href="style1.css">
</head>

<body>
    <div>
    <img src="https://noticebard.com/wp-content/uploads/2022/08/skit.png" width="400" height="300">
    </div>

<div class="container">

<h1>&#127891 COLLEGE ADMISSION FORM</h1>


<form>

<h3>Personal Details-</h3>

<label>Full Name-</label>
<input type="text" placeholder="Enter your name" required>

<label>Email-</label>
<input type="email" placeholder="Enter your email" required>

<label>Phone No.-</label>
<input type="tel" placeholder="Enter phone number" required>

<label>Blood group-</label>
<input type="text" placeholder="Enter your blood group" reuired>

<label>Date of Birth-</label>
<input type="date" required>

<label>Gender-</label>
<input type="radio" name="gender"> Male-
<input type="radio" name="gender"> Female-
<input type="radio" name="gender"> Other-

<h3>Parent Details-</h3>

<label>Father Full name-</label>
<input type="text" placeholder="Enter your father name" required>

<label>Mother Full name-</label>
<input type="text" placeholder="Enter your mother name" required>

<label>Phone No.-</label>
<input type="tel" placeholder="Enter phone number" required>

<h4>Academic Details-</h4>

<label>Course-</label>
<select required>
<option>Select Course</option>
<option>B.Tech</option>
<option>BCA</option>
<option>BBA</option>
<option>B.Sc</option>
</select>

<label>12th Percentage-</label>
<input type="percentage" placeholder="Enter percentage" required>

<label> 10th Percentage-</label>
<input type="percentage" placeholder="Enter percentage" required>

<h3>Address-</h3>

<textarea placeholder="Enter your address" rows="4"></textarea>

<h4>Documents-</h4>

<label>Upload 10th Marksheet-</label>
<input type="file">

<label>upload 12th Marksheet-</label>
<input type="file">

<label>Upload aadhaar card-</label>
<input type="file">

<label>Upload student photo-</label>
<input type="file">

<br><br>

<label>I confirm that the information is correct.</label>
<input type="checkbox" required>


<br><br>

<button type="submit">Submit Form</button>

</form>

</div>

</body>
</html>
