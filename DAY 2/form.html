<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>Student Registration Form</h2>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter Full Name" style="width:350px">

        <label>Email</label>
        <input type="email" placeholder="Enter Email" style="width:350px">

        <label>Phone Number</label>
        <input type="text" placeholder="Enter Phone Number" style="width:350px">

        <label>Date of Birth</label>
        <input type="date" style="width:350px">

        <label>Gender</label>

        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <br><br>

        <label>Course</label>

        <select style="width:370px">
            <option>Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>B.Sc</option>
            <option>B.Com</option>
        </select>

        <label>Password</label>
        <input type="password" placeholder="Enter Password" style="width:350px">

        <label> Address</label>
        <textarea placeholder="Address" rows="3" cols="48"></textarea>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
