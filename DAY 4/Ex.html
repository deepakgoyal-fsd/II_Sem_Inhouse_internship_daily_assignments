<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Mode Toggle</title>
  <style>
    body {
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      transition: 0.3s;
      padding: 20px;
    }

    body.dark-mode {
      background: #121212;
      color: white;
    }

    .toggle-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <form class="toggle-box">
    <label for="modeToggle">Dark Mode</label>
    <input type="checkbox" id="modeToggle">
  </form>

  <h1>Welcome</h1>
  <p>This page changes between light and dark mode.</p>

  <script>
    const toggle = document.getElementById("modeToggle");
    toggle.addEventListener("change", () => {
      document.body.classList.toggle("dark-mode");
    });
  </script>

</body>
</html>
