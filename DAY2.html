<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#ba1ac0,#8dc568);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:500px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    transition:0.3s;
}

.container:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input[type="text"],
input[type="email"],
input[type="date"],
input[type="tel"],
textarea,
input[type="file"]{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    transition:0.3s;
}

input:focus,
textarea:focus{
    border-color:#33bb70;
    outline:none;
    box-shadow:0 0 8px rgba(177, 35, 153, 0.4);
}

.gender{
    margin-top:8px;
}

.gender label{
    display:inline;
    font-weight:normal;
    margin-right:20px;
}

textarea{
    resize:none;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
}

input[type="submit"],
input[type="reset"]{
    width:48%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    color:white;
    transition:0.3s;
}

input[type="submit"]{
    background:#28a745;
}

input[type="submit"]:hover{
    background:#218838;
    transform:scale(1.05);
}

input[type="reset"]{
    background:#dc3545;
}

input[type="reset"]:hover{
    background:#c82333;
    transform:scale(1.05);
}

input[type="file"]{
    cursor:pointer;
}

input[type="file"]:hover{
    background:#f5f5f5;
}
</style>

</head>
<body>

<div class="container">

<h1>Student Registration Form</h1>

<form action="submit.php" method="post" enctype="multipart/form-data">

<label>Full Name</label>
<input type="text" name="name" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" name="email" placeholder="Enter your email" required>

<label>Gender</label>

<div class="gender">
<input type="radio" name="gender" value="Male" required> Male
<input type="radio" name="gender" value="Female"> Female
<input type="radio" name="gender" value="Other"> Other
</div>

<label>Date of Birth</label>
<input type="date" name="dob" required>

<label>Mobile Number</label>
<input type="tel"
name="mobile"
pattern="[0-9]{10}"
placeholder="Enter 10-digit mobile number"
required>

<label>Address</label>
<textarea
name="address"
rows="4"
placeholder="Enter your address"
required></textarea>

<label>Aadhar Number</label>
<input
type="text"
name="aadhar"
pattern="[0-9]{12}"
placeholder="Enter 12-digit Aadhar number"
required>

<label>Upload Photo</label>
<input
type="file"
name="photo"
accept=".jpg,.jpeg,.png"
required>

<div class="buttons">
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</div>

</form>

</div>

</body>
</html>
