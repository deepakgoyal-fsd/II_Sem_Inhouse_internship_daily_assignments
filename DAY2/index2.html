<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        
    </style>
</head>
<body>
    <div>

    </div>

    <h2>Registration Form</h2>

    <form action="#" method="post">

        <label>First Name:</label><br>
        <input type="text" name="fullname" placeholder="Enter your first name" required><br><br>

         <label>Last Name:</label><br>
        <input type="text" name="fullname" placeholder="Enter your last name" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" placeholder="Enter your email" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" placeholder="Enter password" required><br><br>

        <label>Confirm Password:</label><br>
        <input type="password" name="confirm_password" placeholder="Confirm password" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="dob"><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone" placeholder="Enter phone number"><br><br>

        <label>Course:</label><br>
        <select name="course">
            <option value="">--Select Course--</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>B.Sc</option>
            <option>MCA</option>
        </select><br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="30" placeholder="Enter your address"></textarea><br><br>

        <input type="checkbox" required> I agree to the Terms & Conditions
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
