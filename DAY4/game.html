     <style>

    <p apple:> <span id="apple">0</p>

        <p  banana:><span id="banana">0</p>

        <center>
            <button id="reset" onclick="resetgame()">RESET
        </button>

        <script>
            let applecount=0;
            let bananacount=0;
            function apple(){
                applecount++;
                document.getElementById("apple").innerHTML=applecount

            }
            function banana(){
                bananacount++;
                document.getElementById("banana").innerHTML=bananacount
            }
            function resetgame(){
                applecount=0;
                bananacount=0;
                document.getElementById("apple").innerHTML=0

            }
            

            
        </script>
