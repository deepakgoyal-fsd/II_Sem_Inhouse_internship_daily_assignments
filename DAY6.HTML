<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light"> <!-- yaha big-light ko bg-light kiya -->
    <div class="container py-5">
        <h2 class="text-center mb-4">Student Records</h2>

        <!-- NAYA BACHA ADD KARNE KA FORM -->
        <div class="card p-3 mb-4 shadow-sm">
            <h5 class="mb-3">Add New Student</h5>
            <div class="row g-2">
                <div class="col-md-4">
                    <input type="text" id="name" class="form-control" placeholder="Student Name">
                </div>
                <div class="col-md-3">
                    <input type="text" id="branch" class="form-control" placeholder="Branch">
                </div>
                <div class="col-md-3">
                    <input type="number" id="cgpa" class="form-control" placeholder="CGPA" step="0.1">
                </div>
                <div class="col-md-2">
                    <button id="addBtn" class="btn btn-success w-100">Add</button>
                </div>
            </div>
        </div>

        <input type="text" id="search" class="form-control mb-4" placeholder="Search student">
        <div id="container" class="row g-4"></div>
    </div>

    <script>
        // Array ko const se let kiya taaki naya student push kar saken
        let students = [
            { name: "Rahul",branch:"CSE",cgpa:8.5 },
            { name: "Ram",branch:"CSE",cgpa:9.5 },
            { name: "Raghav",branch:"CSE",cgpa:8.9 },
            { name: "Siya",branch:"CSE",cgpa:7.5 },
            { name: "Shyaml",branch:"CSE",cgpa:8.8 },
            { name: "Raj",branch:"CSE",cgpa:8.3 },
            { name: "Aman",branch:"CSE",cgpa:8.3 },
            { name: "Jiya",branch:"CSE",cgpa:9.2 },
            { name: "Jay",branch:"CSE",cgpa:9.0 },
            { name: "Ajay",branch:"CSE",cgpa:8.8 },
        ];

        // Naya function banaya cards dikhane ke liye
        function displayStudents(){
            let html = "";
            for(let i=0; i<students.length; i++) {
                html += `
                <div class="col-md-4 card-item">
                    <div class="card shadow">
                        <div class="card-body">
                            <h4>${students[i].name}</h4>
                            <button class="btn btn-primary btn-sm mt-2">Show Details</button>
                            <div class="details mt-3" style="display:none;">
                                <p><strong>Branch:</strong> ${students[i].branch}</p>
                                <p><strong>CGPA:</strong> ${students[i].cgpa}</p>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }
            document.getElementById("container").innerHTML = html;
        }

        displayStudents(); // page load hote hi call hoga

        // Show/Hide details
        $(document).on("click",".btn-primary",function(){
            $(this).next(".details").slideToggle();
        });

        // Search
        $("#search").keyup(function(){
            let val = $(this).val().toLowerCase();
            $(".card-item").each(function(){
                let name = $(this).find("h4").text().toLowerCase();
                $(this).toggle(name.includes(val));
            });
        });

        // NAYA STUDENT ADD KARNE KA CODE
        $("#addBtn").click(function(){
            let name = $("#name").val();
            let branch = $("#branch").val();
            let cgpa = $("#cgpa").val();
            
            if(name != "" && branch != "" && cgpa != ""){
                students.push({ name: name, branch: branch, cgpa: parseFloat(cgpa) });
                displayStudents(); // list dubara show karo
                $("#name").val(""); // form clear
                $("#branch").val("");
                $("#cgpa").val("");
            } else {
                alert("Please fill all fields!");
            }
        });

    </script>
</body>
</html>
