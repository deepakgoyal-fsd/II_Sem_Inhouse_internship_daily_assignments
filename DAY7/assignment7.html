<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Data Directory</title>
    
    <!-- Requirement: Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 0;
        }
        .custom-card {
            background-color: #1e2233;
            border: 1px solid #2d334a;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
        }

        .custom-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
            border-color: #20c997;
        }

        .card-text {
            color: #a0a6c0;
            font-size: 0.9em;
        }

        .search-bar {
            background-color: #1e2233;
            color: white;
            border: 1px solid #2d334a;
        }
        
        .search-bar:focus {
            background-color: #2a2f45;
            color: white;
            border-color: #20c997;
            box-shadow: 0 0 0 0.25rem rgba(32, 201, 151, 0.25);
        }
        #loading-state, #error-state {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
            <h2>User Directory</h2>
            <h4><span class="badge bg-success" id="count-badge">0 Users</span></h4>
        </div>
        <div class="mb-4">
            <input type="text" id="searchInput" class="form-control search-bar p-3" placeholder="Search users by name...">
        </div>
        <div id="loading-state" class="text-center my-5">
            <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted">Fetching data from API...</p>
        </div>

        <!-- Requirement: Error Handling State -->
        <div id="error-state" class="alert alert-danger text-center" role="alert">
            <strong>Oops!</strong> Something went wrong while fetching the data. Please check your connection and try again.
        </div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="card-container">
        </div>
    </div>

    <!-- Script to handle API Fetching and DOM Manipulation -->
    <script>
        const apiUrl = 'https://jsonplaceholder.typicode.com/users';
        let allUsers = [];
        const cardContainer = document.getElementById('card-container');
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const countBadge = document.getElementById('count-badge');
        const searchInput = document.getElementById('searchInput');
        async function fetchAPI() {
            try {
                loadingState.style.display = 'block';
                cardContainer.innerHTML = '';
                errorState.style.display = 'none';
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                allUsers = await response.json();
                renderCards(allUsers);
            } catch (error) {
                console.error("Failed to fetch data:", error);
                errorState.style.display = 'block';
            } finally {
                loadingState.style.display = 'none';
            }
        }
        function renderCards(data) {
            countBadge.textContent = `${data.length} Users`;
            
            cardContainer.innerHTML = ''; 
            data.forEach(user => {
                const cardHTML = `
                    <div class="col">
                        <div class="card custom-card p-3">
                            <div class="card-body">
                         <h5 class="card-title text-white mb-3">${user.name}</h5>
                         <p class="card-text mb-1"><strong>Username:</strong> @${user.username}</p>
                          <p class="card-text mb-1"><strong>Email:</strong> ${user.email}</p>
                          <p class="card-text mb-1"><strong>Company:</strong> ${user.company.name}</p>
                          <p class="card-text"><strong>Website:</strong> <a href="http://${user.website}" class="text-info text-decoration-none" target="_blank">${user.website}</a></p>
                            </div>
                        </div>
                    </div>
                `;
                cardContainer.innerHTML += cardHTML;
            });
            if(data.length === 0) {
                cardContainer.innerHTML = `<div class="col-12 text-center text-muted"><p>No users found matching your search.</p></div>`;
            }
        }
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredUsers = allUsers.filter(user => 
                user.name.toLowerCase().includes(searchTerm)
            );
            renderCards(filteredUsers);
        });

        fetchAPI();
    </script>
</body>
</html>
