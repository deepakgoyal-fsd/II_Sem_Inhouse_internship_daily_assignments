<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistration form </title>
    <link rel="stylesheet" href="resistration.css">
</head>
<body>
    
<h2 align="center"> Registration Form </h2>
<h3 align="center" id="box1">Fill the required details to register </h3>
<div>
  <form>
    <label> Full Name </label> 
    <input type="text"  name="full name" placeholder="Enter your name " > <br><br>
    <label> Email Id :</label>
    <input type="text"  mail="mail" placeholder="enter your email id"> <br><br>
    <label> Contact Number :</label>
    <input type="text" number="number" placeholder="enter your contact number"> <br><br>
    <label>  Date of Birth </label> 
     <input type="date" name="dob"><br><br>
    <label>Aadhar number : </label>
    <input type="text" number="aadhar" placeholder="enter your aadhar number"><br><br>
    <label> Passward:</label>
    <input type="password" placeholder="Enter your password"><br><br>
     <label> Re-Passward:</label>
    <input type="password" placeholder="Re-enter your password"><br><br>
     <label> Address:</label>
    <input type="text" placeholder="Enter your address"><br><br>
    <label> City :</label><br>
    <select name="City">
        <option> select City</option>
        <option>Bikaner</option>
         <option>jaipur</option>
        <option>jhunjhunu</option>
         <option>kota</option> </select> <br>
     <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>
    <label> Course :</label><br>
    <select name="course">
        <option> select course</option>
        <option>B.tech</option>
         <option>BBA</option>
        <option>BSC</option>
         <option>Bcom</option> </select> <br>

 <input type="checkbox" required>
        I agree to the Terms and Conditions.
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">


  </form>
</div>
</body>
</html>
