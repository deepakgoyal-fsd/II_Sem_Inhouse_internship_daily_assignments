<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia&effect=neon|outline|emboss|shadow-multiple">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card profile-card shadow-sm">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-4 text-center mb-3 mb-md-0">
                                <img src="assets/profile.jpg" alt="Profile picture" class="profile-picture img-fluid rounded-circle mx-auto d-block">
                            </div>
                            <div class="col-md-8">
                                <h2 class="profile text-primary mb-1">Bhagyaveer Singh Chauhan</h2>
                                <p class="name mb-1">Passion: Software Engineer</p>
                                <p class="email text-muted mb-2">bhagyaveer.chauhan@example.com</p>
                                <div class="d-flex gap-2">
                                    <a href="#" class="btn btn-primary btn-sm">Contact</a>
                                    <a href="assets/John_Doe_Resume.pdf" download="John_Doe_Resume.pdf" class="btn btn-outline-primary btn-sm">Download Resume</a>
                                </div>
                                <div class="mt-3 tag-list">
                                    <span class="badge bg-primary me-1">Python</span>
                                    <span class="badge bg-secondary me-1">AI</span>
                                    <span class="badge bg-info text-dark me-1">C#</span>
                                    <span class="badge bg-success me-1">C++</span>
                                    <span class="badge bg-warning text-dark me-1">C</span>
                                    <span class="badge bg-danger me-1">React JS</span>
                                    <span class="badge bg-dark me-1">REST API</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-dark text-white py-3 mt-4">
        <div class="container text-center">
            <p class="mb-0">© 2026 John Doe · <a href="#" class="text-white text-decoration-underline">Privacy</a></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
