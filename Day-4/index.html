<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Day 4 — Counter & Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4">counter , form validation , dark mode toggle</h1>
        <div>
          <button id="darkToggle" class="btn btn-outline-secondary btn-sm">Toggle Dark</button>
        </div>
      </div>

      <div class="row gy-4">
        <div class="col-md-4">
          <div class="card p-3">
            <h2 class="h5">Click Counter</h2>
            <p class="mb-1">Count: <span id="count">0</span></p>
            <button id="incBtn" class="btn btn-primary">+1</button>
          </div>
        </div>

        <div class="col-md-8">
          <div class="card p-3">
            <h2 class="h5">Register</h2>
            <p class="text-muted">Enter details and click Register. Errors show below fields if any.</p>
            <form id="regForm" novalidate>
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input id="name" name="name" class="form-control" placeholder="Your name">
                <div class="invalid-feedback" aria-live="polite"></div>
              </div>
              <div class="mb-3">
                <label for="className" class="form-label">Class</label>
                <input id="className" name="className" class="form-control" placeholder="e.g., 10A">
                <div class="invalid-feedback" aria-live="polite"></div>
              </div>
              <button id="registerBtn" type="button" class="btn btn-success">Register</button>
            </form>
            <div id="formMessage" class="mt-3" role="status" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Counter
      (function(){
        const countEl = document.getElementById('count');
        const btn = document.getElementById('incBtn');
        let count = 0;
        btn.addEventListener('click', ()=>{
          count += 1;
          countEl.textContent = count;
        });
      })();

      // Dark mode toggle
      (function(){
        const toggle = document.getElementById('darkToggle');
        const body = document.body;
        function setMode(dark){
          body.classList.toggle('dark-mode', !!dark);
          toggle.textContent = dark ? 'Light Mode' : 'Dark Mode';
        }
        // remember preference
        const saved = localStorage.getItem('day4-dark');
        setMode(saved === '1');
        toggle.addEventListener('click', ()=>{
          const now = !body.classList.contains('dark-mode');
          setMode(now);
          localStorage.setItem('day4-dark', now ? '1' : '0');
        });
      })();

      // Form validation using DOM errors
      (function(){
        const form = document.getElementById('regForm');
        const nameInput = document.getElementById('name');
        const classInput = document.getElementById('className');
        const registerBtn = document.getElementById('registerBtn');
        const msg = document.getElementById('formMessage');

        function clearError(input){
          input.classList.remove('is-invalid');
          const err = input.nextElementSibling;
          if(err && err.classList.contains('invalid-feedback')) err.textContent = '';
        }

        function setError(input, text){
          input.classList.add('is-invalid');
          const err = input.nextElementSibling;
          if(err && err.classList.contains('invalid-feedback')) err.textContent = text;
        }

        function validate(){
          let ok = true;
          clearError(nameInput);
          clearError(classInput);
          msg.textContent = '';

          if(!nameInput.value.trim()){ setError(nameInput, 'Name is required'); ok = false; }
          if(!classInput.value.trim()){ setError(classInput, 'Class is required'); ok = false; }

          return ok;
        }

        registerBtn.addEventListener('click', ()=>{
          if(validate()){
            msg.textContent = 'Registration successful.';
            msg.className = 'text-success';
            // reset form after success
            form.reset();
          } else {
            msg.textContent = 'Please fix the errors above.';
            msg.className = 'text-danger';
          }
        });

        // clear errors on input
        [nameInput, classInput].forEach(i=> i.addEventListener('input', ()=> clearError(i)));
      })();
    </script>
  </body>
</html>
