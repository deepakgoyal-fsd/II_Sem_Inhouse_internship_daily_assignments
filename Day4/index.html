<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Welcome to My Landing Page</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>JavaScript Interactive Project</h2>
    <p>Practice DOM Manipulation, Events, and Validation.</p>

    <button id="darkBtn">Dark Mode</button>
</section>

<hr>

<section>

    <h2>Click Counter</h2>

    <h3>Count: <span id="count">0</span></h3>

    <button id="clickBtn">Click Me</button>

    <button id="resetBtn">Reset</button>

</section>

<hr>

<section>

<h2>Registration Form</h2>

<form id="myForm">

<label>Name</label><br>

<input type="text" id="name"><br>

<small id="nameError"></small>

<br><br>

<label>Email</label><br>

<input type="text" id="email"><br>

<small id="emailError"></small>

<br><br>

<button type="submit">Submit</button>

</form>

<p id="success"></p>

</section>

<script>
    // -------------------
// Dark Mode Toggle
// -------------------

const darkBtn = document.getElementById("darkBtn");

darkBtn.addEventListener("click", function () {

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        darkBtn.textContent = "Light Mode";
    }else{
        darkBtn.textContent = "Dark Mode";
    }

});


// -------------------
// Click Counter
// -------------------

let count = 0;

const countDisplay = document.getElementById("count");

document.getElementById("clickBtn").addEventListener("click", function(){

    count++;

    countDisplay.textContent = count;

});

document.getElementById("resetBtn").addEventListener("click", function(){

    count = 0;

    countDisplay.textContent = count;

});


// -------------------
// Form Validation
// -------------------

const form = document.getElementById("myForm");

form.addEventListener("submit", function(event){

    event.preventDefault();

    let name = document.getElementById("name").value.trim();

    let email = document.getElementById("email").value.trim();

    let valid = true;

    document.getElementById("nameError").textContent = "";
    document.getElementById("emailError").textContent = "";
    document.getElementById("success").textContent = "";

    if(name === ""){
        document.getElementById("nameError").textContent = "Name is required";
        valid = false;
    }

    if(email === ""){
        document.getElementById("emailError").textContent = "Email is required";
        valid = false;
    }
    else if(!email.includes("@")){
        document.getElementById("emailError").textContent = "Email must contain @";
        valid = false;
    }

    if(valid){
        document.getElementById("success").textContent =
        "Form submitted successfully!";
        form.reset();
    }

});
</script>

</body>
</html>
