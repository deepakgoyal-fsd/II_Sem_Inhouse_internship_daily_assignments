<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Swap - Product Directory</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-box-seam-fill"></i>
                Product Directory
            </a>
        </div>
    </nav>

    <!-- Header -->
    <section class="container mt-4">

        <div class="text-center">

            <h1 class="display-5 fw-bold">
                API Swap Assignment
            </h1>

            <p class="text-light">
                Products fetched from DummyJSON API
            </p>

        </div>

        <!-- Search -->

        <div class="row justify-content-center mt-4">

            <div class="col-md-6">

                <input
                    type="text"
                    class="form-control form-control-lg"
                    id="searchBox"
                    placeholder="Search Product...">

            </div>

        </div>

        <!-- Product Count -->

        <div class="text-center mt-3">

            <span class="badge bg-success fs-6">
                Total Products :
                <span id="count">0</span>
            </span>

        </div>

    </section>

    <!-- Loading -->

    <div id="loading" class="text-center my-5">

        <div class="spinner-border text-info" role="status"></div>

        <h5 class="mt-3 text-light">
            Loading Products...
        </h5>

    </div>

    <!-- Error -->

    <div class="container">

        <div id="error" class="alert alert-danger d-none">

            Failed to load products.

        </div>

    </div>

    <!-- Cards -->

    <section class="container my-5">

        <div class="row g-4" id="productContainer">

        </div>

    </section>

    <!-- Footer -->

    <footer class="bg-dark text-center text-light p-3">

        API Swap Assignment © 2026

    </footer>

    <script src="script.js"></script>

</body>

</html>
