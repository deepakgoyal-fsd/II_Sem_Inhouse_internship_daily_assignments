<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live User Directory</title>
    
    <link href="bootstrap.min.css" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1 class="text-center mb-4">Live User Directory</h1>
        <div class="card mb-4">
    <div class="card-body">
        <h5>Add New Student</h5>
        <form id="student-form">
            <input type="text" id="name" class="form-control mb-2" placeholder="Enter Name" required>
            <input type="email" id="email" class="form-control mb-2" placeholder="Enter Email" required>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</div>
        <div id="user-container"></div> 
    </div>

    <script src="javascript.js"></script>
</body>
</html>
