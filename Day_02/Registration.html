<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #d1d1d1;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 2rem;
        }
        .card {
            background: #b9dee9;
            border: 1px solid #000000;
            border-radius: 12px;
            padding: 2rem 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 1.75rem;
            padding-left: 0.75rem;
        }
        .field {
            margin-bottom: 1.25rem;
        }
        .field label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .field input[type="text"],
        .field input[type="email"],
        .field input[type="number"],
        .field input[type="tel"],
        .field input[type="password"] {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fafafa;
            color: #1a1a1a;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            background: #fff;
        }
        .field input::placeholder {
            color: #aaa;
        }
        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .radio-group {
            display: flex;
            gap: 1.5rem;
            margin-top: 4px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #1a1a1a;
            font-weight: 400;
            cursor: pointer;
        }
        .radio-group input[type="radio"] {
            accent-color: #2563eb;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }
        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 1.5rem 0;
        }
        .submit-btn {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.5rem;
            font-family: inherit;
            transition: background-color 0.15s;
        }
        .submit-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 style="color: #1d4ed8; font-size: xx-large; background-color: #a9c3cb;">Register</h1>
        <form action="#" method="post">

            <div class="field">
                <label for="full-name">Full name</label>
                <input type="text" id="full-name" name="full-name"
                       placeholder="Name" autocomplete="name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="Email_id@example.com" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Ph." autocomplete="tel">
            </div>

            <div class="field">
                <label for="age">Age</label>
                <input type="number" id="age" name="age"
                       placeholder="Age" min="1" max="120">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="At least 8 characters" autocomplete="new-password" required>
                <p class="hint">Use 8+ characters with a mix of letters and numbers.</p>
            </div>

            <hr>

            <div class="field">
                <label>Gender</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="male"> Male
                    </label>
                    <label>
                        <input type="radio" name="gender" value="female"> Female
                    </label>
                    <label>
                        <input type="radio" name="gender" value="other"> Other
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-btn">Login</button>

        </form>
    </div>

</body>
</html>
