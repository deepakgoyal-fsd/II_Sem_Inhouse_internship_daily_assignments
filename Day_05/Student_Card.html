<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Directory</h1>

    <input type="text" id="search" placeholder="Search student by name">

    <div id="studentContainer"></div>

    <div id="detailView">
        <h2>Student Details</h2>

        <p><strong>Name:</strong> <span id="dName"></span></p>

        <p><strong>Roll:</strong> <span id="dRoll"></span></p>

        <p><strong>Course:</strong> <span id="dCourse"></span></p>

        <p><strong>Email:</strong> <span id="dEmail"></span></p>

        <button id="toggleBtn">Show More</button>

        <div id="extraInfo">
            <p><strong>Phone:</strong> <span id="dPhone"></span></p>

            <p><strong>Address:</strong> <span id="dAddress"></span></p>

            <p><strong>CGPA:</strong> <span id="dCgpa"></span></p>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
