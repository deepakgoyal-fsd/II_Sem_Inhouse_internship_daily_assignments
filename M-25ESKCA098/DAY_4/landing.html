<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page</title>

<style>
html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

nav{
background:#0d6efd;
padding:15px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:15px;
font-weight:bold;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(to right,#4facfe,#00f2fe);
color:white;
}

input{
padding:10px;
width:250px;
margin:10px;
}

button{
padding:10px 20px;
background:#0d6efd;
color:white;
border:none;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#ff5722;
transform:scale(1.1);
}

#about{
padding:50px;
text-align:center;
background:white;
}

footer{
background:#222;
color:white;
padding:20px;
text-align:center;
}
</style>

</head>
<body>

<nav>
<a href="#home">Home</a>
<a href="#about">About</a>
</nav>

<section class="hero" id="home">
<h1>Welcome to My Page</h1>

<input type="text" id="name" placeholder="Enter your name">

<button onclick="greet()">Submit</button>

<h2 id="msg"></h2>

</section>

<section id="about">
<h2>About Us</h2>
<p>This is a simple landing page created using HTML, CSS and JavaScript.</p>
</section>

<footer>
<p>© 2026 My Landing Page</p>
</footer>

<script>
function greet(){

let name=document.getElementById("name").value;

if(name==""){
alert("Please enter your name");
}
else{
document.getElementById("msg").innerHTML="Welcome, "+name+"!";
}

}
</script>

</body>
</html>
