<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>
    <center>
        <hr>
<box style="background-color: rgb(228, 192, 74); width: 500px; height: 800px; border-radius: 20px;">
<h1>Student Registration Form</h1>

<form>
<hr>
   <h2> Full Name:</h2>
    <input type="text" name="fullname" style="background-color: rgb(217, 218, 208);" placeholder="Enter your full name"><br><br>

    <h2>Email:</h2>
    <input type="email" name="email" style="background-color:rgb(217, 218, 208);" placeholder="Enter your email"><br><br>

    <h2>Password:</h2>
    <input type="password" name="password" style="background-color:rgb(217, 218, 208);" placeholder="Enter your password"><br><br>

    <h2>Mobile Number:</h2>
    <input type="tel" name="mobile"  style="background-color: rgb(217, 218, 208);"placeholder="Enter your mobile number"><br><br>

    <h2>Date of Birth:</h2>
    <input type="date" name="dob" style="background-color: rgb(217, 218, 208);"><br><br>

    <h2>Gender:</h2>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other
    <br><br>

    <h2>Hobbies:</h2>
    <input type="checkbox"> Reading
    <input type="checkbox"> Sports
    <input type="checkbox"> Music
    <br><br>

    <h2>State:</h2>
    <select
    style="background-color: rgb(228, 192, 74);">
        <option>Select State</option>
        <option>Rajasthan</option>
        <option>Delhi</option>
        <option>Gujarat</option>
        <option>Punjab</option>
    </select>
    <br><br>

    <h2>Skills:</h2>
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <input type="checkbox"> JavaScript
    <input type="checkbox"> PHP
    <br><br>

    <h2>Upload Resume:</h2>
    <input type="file">
    <br><br>

    <h2>About Yourself:</h2>
    <textarea rows="5" cols="30"placeholder="write about you"></textarea>
    <br><br>
<button type="button" style="background-color: rgb(127, 76, 221);">
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</button>
</form>
</box>
</center>
</body>
</html>
