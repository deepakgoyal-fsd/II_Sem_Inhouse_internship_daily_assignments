<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav{
            background-color: #2d83aa;
            padding: 15px 30px;
        }

        nav ul{
            list-style: none;
            text-align: center;
        }

        nav ul li{
            display: inline-block;
            margin: 0 20px;
        }

        nav ul li a{
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-family: Arial, sans-serif;
            padding: 8px 15px;
            border-radius: 5px;
        }

        nav ul li a:hover{
            background-color: white;
            color: #2d83aa;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>
</html>
