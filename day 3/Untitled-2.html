<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navigation Bar</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        nav{
            background-color:#2c3e50;
            padding:15px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            color:white;
            font-size:24px;
            font-weight:bold;
        }

        .nav-links{
            list-style:none;
            display:flex;
            align-items:center;
            gap:30px;
        }

        .nav-links a{
            color:white;
            text-decoration:none;
            font-size:18px;
            transition:0.3s;
        }

        .nav-links a:hover{
            color:#f1c40f;
        }

        .login-btn{
            background-color:#f1c40f;
            color:#2c3e50;
            padding:8px 18px;
            border-radius:5px;
            font-weight:bold;
        }

        .login-btn:hover{
            background-color:#ffffff;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Company Logo</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Content</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#" class="login-btn">Login</a></li>
        </ul>
    </nav>

</body>
</html>
