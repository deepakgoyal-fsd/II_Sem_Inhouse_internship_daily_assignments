<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            position:relative;
            height: 100vh;
            margin:0;
            background-color:white;
        }
        img{
            width:100px;
            position: absolute;
            cursor:pointer;
        }
    </style>
</head>
<body>
        <p>banana:<span id="banana">0</span></p>
        <p>apple:<span id="apple">0</span></p>
        <p>time left:<span id="timer">10s</span></p>
        <button onclick="startGame()">start game</button>
        <button onclick="restartgame()">restart game</button>
        <button onclick="endGame()">end game</button>
        <img src="banana.png" onclick="clickimage('banana',this)">
        <img src="apple.png"  onclick="clickimage('apple',this)">
        <script>
            let apple=0,banana=0;
            let countdown;
            document.querySelectorAll("img").forEach(img=>{
                img.style.left=Math.random()*(window.innerWidth-100)+"px";
                img.style.top=Math.random()*(window.innerHeight-120)+"px";
            });
            function clickimage(type,img){
                if(type=="apple"){
                    document.getElementById("apple").innerText=++apple;
                }
                else{
                    document.getElementById("banana").innerText=++banana;
                }
                img.style.left=Math.random()*(window.innerWidth-100)+"px";
                img.style.top=Math.random()*(window.innerHeight-120)+"px";
                
            }
            function timer(){
                let timeLeft = 20;
                const timerElement = document.getElementById("timer");
                const countdown = setInterval(()=>{
                    timeLeft--;
                    timerElement.innerText = `${timeLeft}s`;
                    if(timeLeft <= 0){
                        clearInterval(countdown);
                        alert("Time up! Your score is: Apple: "+apple+" Banana: "+banana);
                        darkMode();
                        document.body.innerHTML+="<h2 style='color:white; text-align:center;margin-top:50px;'>game over</h2>";
                    }
                },1000);
            }

            function darkMode(){
                document.body.style.backgroundColor="black";
                document.body.style.color="white";
            }
            function startGame(){
                apple=0;
                banana=0;
                document.getElementById("apple").innerText=apple;
                document.getElementById("banana").innerText=banana;
                timer();

            }
            function restartgame(){
                clearInterval(countdown);
                apple=0;
                banana=0;
                gameTime=20;

                document.getElementById("apple").innerText=0;
                document.getElementById("banana").innerText=0;
                document.getElementById("timer").innerText=gameTime;
                moveimages();
                startTimer();
            }
            function endGame(){
                clearInterval(countdown);
                gameTime=0;
                alert(
                    "Game Ended!\n\n"+
                    "Apple :"+apple+
                    "\nBanana:"+banana
                );
                }
            moveimages();

            
        </script>

    </div>
</body>
</html>
