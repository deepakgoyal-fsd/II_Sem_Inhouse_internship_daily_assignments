<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- JQUERY-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


</head>
<body class="bg-light">
    <div class="container py-5">

        <h2 class="text-center mb-4">student records</h2>
        <input type="text" id="search" class="form-control mb-4" placeholder="search student">
        <div id="container" class="row g-4"></div>
        <div class="row" id="student-card-container"></div>
        <div id="json"></div>
    </div>
    <script>
        const students=[
            {name:"geetanjali" , branch:"cse" , cgpa:9.02 , image:"me.jpg"},
            {name:"bheem" , branch:"cse" , cgpa:7.85,image:"amir.png"},
            {name:"gourav" , branch:"cse" , cgpa:8.0 , image:"dhurandar.png"},
            {name:"piyush" , branch:"cse" , cgpa:6.85 ,image:"download.jpg"},
            {name:"harshita" , branch:"cse" , cgpa:8.85,image:"image.jpg"},
            {name:"sujal", branch:"cse" , cgpa:9.0,image:"tiffin box.png"},
            {name:"aryan" , branch:"cse" , cgpa:8.5,image:"aryan.jpg"},
            {name:"khushi" , branch:"cse" , cgpa:8.75,image:"khushi.jpg"},
            {name:"khusboo" , branch:"cse" , cgpa:9.5,image:"image.jpg"},
            {name:"kratika" , branch:"cse" , cgpa:8.65,image:"aishwarya.png"},
            {name:"gaurav" , branch:"cse" , cgpa:9.0,image:"gaurav.jpg"},
        ];
         
        let html="";

        for (let i = 0; i < students.length; i++) {
            html += `<div class="col-md-4 card-item">
                        <div class="card shadow">
                            <div class="card-body">
                                <h4>${students[i].name}</h4>
                                <button class="btn btn-primary btn-sm mt-2">Show Details</button>
                                <div class="details mt-3" style="display: none;">
                                    <p><strong>Branch:</strong> ${students[i].branch}</p>
                                    <p><strong>CGPA:</strong> ${students[i].cgpa}</p>
                                    <img src="${students[i].image}" width="150" class="img-fluid mb-2">
                                </div>
                            </div>
                        </div>
                    </div>`;
        }
        document.getElementById("container").innerHTML = html;
         
        $(document).on("click" , ".btn" , function(){
            $(this).next(".details").slideToggle();
        });

        $("#search").keyup(function(){
            let val= $(this).val().toLowerCase();
        
            $(".card-item").each(function(){

                let name=$(this).find("h4").text().toLowerCase();

                if(name.includes(val)){
                    $(this).show();
                }
                else{
                    $(this).hide();
                }
            });
        });

        document.getElementById("json").innerHTML=JSON.stringify(students,null,["name","cgpa"],4);

        function replace(key,value){
            if(key=="cgpa")
            return undefined;
        return value;
        }
    </script>
    
</body>
</html>
