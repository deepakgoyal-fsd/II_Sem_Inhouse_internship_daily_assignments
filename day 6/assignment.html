<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Card Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        /* Custom styles to handle the Bonus requirements */
        .card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15) !important;
        }
        /* Bonus light teal background for even indexes */
        .bg-light-teal {
            background-color: #e3fafc !important; 
        }
        .avatar-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <h2 id="user-heading" class="text-center mb-4 fw-bold text-secondary">Loading users...</h2>

        <div id="user-container" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // Target API endpoint for users
            const apiUrl = 'https://jsonplaceholder.typicode.com/users';

            // Fetch the user data using jQuery AJAX
            $.getJSON(apiUrl, function(data) {
                
                // 1. Update Heading dynamically using data.length
                $('#user-heading').text(`Showing ${data.length} users`);

                // Clear the container just in case
                $('#user-container').empty();

                // 2. Loop through each user card data
                $.each(data, function(index, user) {
                    
                    // Determine Avatar URL using the specific template provided: https://i.pravatar.cc/150?img={id}
                    const avatarUrl = `https://i.pravatar.cc/150?img=${user.id}`;
                    
                    // Bonus: Check for alternate background color using modulo operator (i % 2)
                    // Note: index starts at 0 (even), so index 0, 2, 4 get the light teal accent.
                    const bgClass = (index % 2 === 0) ? 'bg-light-teal' : 'bg-white';

                    // 3. Build the responsive card element template
                    const cardTemplate = `
                        <div class="col">
                            <div class="card h-100 shadow-sm border-0 ${bgClass} text-center p-3">
                                <div class="d-flex justify-content-center my-3">
                                    <img src="${avatarUrl}" class="avatar-img border shadow-sm" alt="${user.name}">
                                </div>
                                <div class="card-body p-2">
                                    <h5 class="card-title fw-bold text-dark mb-1">${user.name}</h5>
                                    <p class="card-text text-muted small mb-3">${user.email}</p>
                                    <div class="border-top pt-2">
                                        <span class="badge bg-secondary opacity-75">${user.company.name}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    // 4. Append all cards sequentially into #user-container
                    $('#user-container').append(cardTemplate);
                });

            }).fail(function() {
                // Handle basic request errors gracefully
                $('#user-heading').text('Failed to load user records.').addClass('text-danger');
            });
        });
    </script>
</body>
</html>
