<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Registration Form</h2>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter full name">
        <br><br>

        <label>Email Address</label>
        <input type="email" placeholder="Enter email address">
<br><br>
        <div class="row">
            <div>
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number">
            </div>
<br>
            <div>
                <label for="Birth">Birth Date</label>
                <input type="date">
            </div>
        </div>
<br>
        <label>Gender</label><br>
        <input type="radio" name="gender" id="Male" value="male"> <label for="Male">Male</label>
        <input type="radio" name="gender" id="Female" value="female"> <label for="Female">Female</label>
        <input type="radio" name="gender" id="prefer not to say" value="others"> <label for="Prefer not to say">Prefer not to say</label>

        <br><br>

        <label for="address">Address</label>
        <input type="text" placeholder="Street Address" name="address" id="address">
        <input type="text" placeholder="Street Address Line 2">
        <br><br>

        <div class="row">
            <div>
                <label for="country">Country:</label>
                <input type="text" placeholder="Country" name="Country" id="country">
                <br><br>
            </div>

            <div>
                <label for="City">City:</label>
                <input type="text" placeholder="City" name="City" id="City">
                <br><br>
            </div>
        </div>

        <div class="row">
            <div>
                <label for="Region">Region:</label>
                <input type="text" placeholder="Region" name="Region" id="Region">
            </div>
                   <br>
            <div>
                <label for="Postal">Postal code:</label>
                <input type="text" placeholder="Postal Code" name="postal" id="postal">
                <br><br>

            </div>
        </div>
        <label for="company">company name:</label>
        <input type="text" name="company" id="company" placeholder="XYZ">
        <br>
        <br>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
