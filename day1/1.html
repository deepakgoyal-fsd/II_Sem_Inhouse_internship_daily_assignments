<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Page</title>
</head>
<body>
    <header>
        <h1>Student Profile</h1>
    </header>

    <!-- Section 1: Photo -->
    <section>
        <h2>About Me</h2>
        <img src="https://via.placeholder.com/150" alt="Student Profile Picture">
    </section>

    <!-- Section 2: Education Table -->
    <section>
        <h2>Education</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>Degree</th>
                    <th>Institution</th>
                    <th>Year</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech Computer Science</td>
                    <td>State University</td>
                    <td>2023 - Present</td>
                </tr>
            </tbody>
        </table>
    </section>

    <!-- Section 3: Skills List -->
    <section>
        <h2>Core Skills</h2>
        <ul>
            <li>HTML5 & CSS3</li>
            <li>JavaScript & jQuery</li>
            <li>PHP & MySQL</li>
        </ul>
    </section>

    <!-- Section 4: Favourite Website Link -->
    <section>
        <h2>Resource Hub</h2>
        <p>Visit my favorite technical website: <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a>.</p>
    </section>

    <!-- Section 5: Contact Form -->
    <section>
        <h2>Contact Me</h2>
        <form action="#" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            
            <button type="submit">Send Message</button>
        </form>
    </section>
</body>
</html>
