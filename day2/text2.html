<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form>
        <!-- Name -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <!-- Phone -->
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br><br>

        <!-- Gender -->
        <label>Gender:</label>
        <input type="tel" id="gender" name="gender"><br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>
        <input type="tel" id="dob" name="dob"><br><br>

        <!-- Department -->
        <label for="department">Department:</label>
        <input type="tel" id="depertment" name="depertment"><br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>

        <!-- Confirm Password -->
        <label for="confirm">Confirm Password:</label>
        <input type="password" id="confirm" name="confirm"><br><br>

        <!-- Submit -->
        <input type="https://scrumdigital.com/" value="Submit">
    </form>
</body>
</html>
