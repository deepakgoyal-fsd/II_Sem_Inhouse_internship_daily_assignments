<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallpaper Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0d1117;
color:white;
}

header{
padding:30px 20px;
text-align:center;
background:#161b22;
box-shadow:0 2px 10px rgba(0,0,0,.4);
}

header h1{
font-size:42px;
margin-bottom:20px;
color:#00d4ff;
}

header p{
margin-bottom:20px;
color:#ccc;
}

#search{
width:380px;
max-width:90%;
padding:12px 20px;
border:none;
border-radius:30px;
font-size:16px;
outline:none;
margin-bottom:20px;
}

.categories{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
}

.categories button{
padding:10px 20px;
border:none;
border-radius:30px;
cursor:pointer;
background:#222;
color:white;
transition:.3s;
font-size:15px;
}

.categories button:hover,
.categories .active{
background:#00b894;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
padding:40px;
}

.card{
background:#161b22;
border-radius:15px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 15px 25px rgba(0,0,0,.5);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
display:block;
}

.info{
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.info h3{
font-size:18px;
}

.info a{
text-decoration:none;
background:#00b894;
color:white;
padding:8px 15px;
border-radius:20px;
transition:.3s;
}

.info a:hover{
background:#009874;
}

footer{
text-align:center;
padding:25px;
color:#999;
background:#161b22;
}

@media(max-width:700px){

header h1{
font-size:30px;
}

.gallery{
padding:20px;
}

}
</style>

</head>
<body>

<header>

<h1>Wallpaper Hub</h1>

<p>Download Beautiful Wallpapers For Free</p>

<input
type="text"
id="search"
placeholder="Search Wallpapers...">

<div class="categories">

<button class="active" data-filter="all">All</button>

<button data-filter="nature">Nature</button>

<button data-filter="anime">Anime</button>

<button data-filter="cars">Cars</button>

<button data-filter="space">Space</button>

</div>

</header>

<section class="gallery">

<div class="card nature">
<img src="https://picsum.photos/600/400?random=1">
<div class="info">
<h3>Mountain View</h3>
<a href="https://picsum.photos/1920/1080?random=1" download>Download</a>
</div>
</div>

<div class="card anime">
<img src="https://picsum.photos/600/400?random=2">
<div class="info">
<h3>Anime Style</h3>
<a href="https://picsum.photos/1920/1080?random=2" download>Download</a>
</div>
</div>

<div class="card cars">
<img src="https://picsum.photos/600/400?random=3">
<div class="info">
<h3>Sports Car</h3>
<a href="https://picsum.photos/1920/1080?random=3" download>Download</a>
</div>
</div>

<div class="card space">
<img src="https://picsum.photos/600/400?random=4">
<div class="info">
<h3>Galaxy</h3>
<a href="https://picsum.photos/1920/1080?random=4" download>Download</a>
</div>
</div>

<div class="card nature">
<img src="https://picsum.photos/600/400?random=5">
<div class="info">
<h3>Forest</h3>
<a href="https://picsum.photos/1920/1080?random=5" download>Download</a>
</div>
</div>

<div class="card cars">
<img src="https://picsum.photos/600/400?random=6">
<div class="info">
<h3>Luxury Car</h3>
<a href="https://picsum.photos/1920/1080?random=6" download>Download</a>
</div>
</div>

<div class="card anime">
<img src="https://picsum.photos/600/400?random=7">
<div class="info">
<h3>Anime Warrior</h3>
<a href="https://picsum.photos/1920/1080?random=7" download>Download</a>
</div>
</div>

<div class="card space">
<img src="https://picsum.photos/600/400?random=8">
<div class="info">
<h3>Stars</h3>
<a href="https://picsum.photos/1920/1080?random=8" download>Download</a>
</div>
</div>

</section>

<footer>

© 2026 Wallpaper Hub

</footer>

<script>

const search=document.getElementById("search");

const cards=document.querySelectorAll(".card");

search.addEventListener("keyup",()=>{

const value=search.value.toLowerCase();

cards.forEach(card=>{

const title=card.querySelector("h3").innerText.toLowerCase();

if(title.includes(value)){
card.style.display="block";
}
else{
card.style.display="none";
}

});

});

const buttons=document.querySelectorAll(".categories button");

buttons.forEach(button=>{

button.addEventListener("click",()=>{

buttons.forEach(btn=>btn.classList.remove("active"));

button.classList.add("active");

const filter=button.dataset.filter;

cards.forEach(card=>{

if(filter=="all"){
card.style.display="block";
}
else if(card.classList.contains(filter)){
card.style.display="block";
}
else{
card.style.display="none";
}

});

});

});

</script>

</body>
</html>
