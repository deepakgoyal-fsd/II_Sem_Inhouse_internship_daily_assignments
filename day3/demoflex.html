<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navigation Bar</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        
        .navbar {
            background-color: #333;
            padding: 15px 30px;
            
            
            display: flex; 
            
            
            align-items: center; 
            
            
            justify-content: space-between; 
        }

        
        .nav-links {
            list-style: none;
            
            
            display: flex; 
            
            
            gap: 20px; 
        }

        
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #ffcc00; 
        }

        
        .login-btn {
            background-color: #ffcc00;
            color: #333;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background-color: #e6b800;
        }

    
        .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">MyCollege</div>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>

        <button class="login-btn">Login</button>
    </nav>

</body>
</html>
