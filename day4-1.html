<!DOCTYPE html>
<html lang="en">
<head>
    <title>
        Small Page
    </title>
    <body>
        <h1>Welcome to My Page</h1>
        <button type="button" class="btn" id="btn">Home</button>
        <button type="button" class="btn2" id="btn2">Reset</button>
        <script>
            const btn = document.getElementById('btn');
            btn.addEventListener('click', function () {
                let count = parseInt(btn.dataset.count|| 0);
                count++;
                btn.dataset.count = count;
                document.querySelector('h1').textContent = `Clicks: ${count}`;
                 const btn2 = document.getElementById('btn2');
                 btn2.addEventListener('click', function () {
                     btn.dataset.count = 0;
                     document.querySelector('h1').textContent = `Clicks: 0`;
                 });

            });
        </script>
    </body> 
</head>
</html>
