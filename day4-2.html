<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    transition:0.4s;
}

.container{
    width:500px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    transition:0.4s;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

#toggleBtn{
    width:100%;
    padding:10px;
    margin-bottom:20px;
    background:#333;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

#toggleBtn:hover{
    background:#555;
}

label{
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

textarea{
    resize:none;
}

.gender{
    display:flex;
    gap:20px;
    margin-top:10px;
    margin-bottom:5px;
}

.gender label{
    font-weight:normal;
}

.gender input{
    width:auto;
    margin-right:5px;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#0056b3;
}

.error{
    color:red;
    font-size:13px;
    margin-bottom:10px;
    display:block;
}

.success{
    color:green;
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

/* Dark Mode */

.dark-mode{
    background:#222;
}

.dark-mode .container{
    background:#333;
    color:white;
}

.dark-mode h2,
.dark-mode label{
    color:white;
}

.dark-mode input,
.dark-mode select,
.dark-mode textarea{
    background:#444;
    color:white;
    border:1px solid #777;
}

.dark-mode #toggleBtn{
    background:#ffc107;
    color:black;
}
</style>

</head>

<body>

<div class="container">

<h2>Student Registration Form</h2>

<button type="button" id="toggleBtn" onclick="toggleMode()">
🌙 Dark Mode
</button>

<form id="registrationForm">

<label>Student Name</label>
<input type="text" id="name">
<span class="error" id="nameError"></span>

<label>Father's Name</label>
<input type="text" id="father">
<span class="error" id="fatherError"></span>

<label>Mother's Name</label>
<input type="text" id="mother">
<span class="error" id="motherError"></span>

<label>Email</label>
<input type="email" id="email">
<span class="error" id="emailError"></span>

<label>Phone Number</label>
<input type="text" id="phone" maxlength="10">
<span class="error" id="phoneError"></span>

<label>Gender</label>

<div class="gender">
<label><input type="radio" name="gender" value="Male">Male</label>
<label><input type="radio" name="gender" value="Female">Female</label>
<label><input type="radio" name="gender" value="Other">Other</label>
</div>

<span class="error" id="genderError"></span>

<label>Date of Birth</label>
<input type="date" id="dob">
<span class="error" id="dobError"></span>

<label>Course</label>

<select id="course">
<option value="">Select Course</option>
<option>B.Tech</option>
<option>BCA</option>
<option>BBA</option>
<option>B.Sc</option>
<option>MCA</option>
<option>MBA</option>
<option>M.Tech</option>
</select>

<span class="error" id="courseError"></span>

<label>Address</label>

<textarea id="address" rows="4"></textarea>
<span class="error" id="addressError"></span>

<button type="submit">Register</button>

</form>

<p id="message" class="success"></p>
</div>
<script>

document.getElementById("registrationForm").addEventListener("submit", function(e){

    e.preventDefault();

    // Clear all previous errors
    document.querySelectorAll(".error").forEach(function(error){
        error.innerHTML="";
    });

    document.getElementById("message").innerHTML="";

    let valid=true;

    let name=document.getElementById("name").value.trim();
    let father=document.getElementById("father").value.trim();
    let mother=document.getElementById("mother").value.trim();
    let email=document.getElementById("email").value.trim();
    let phone=document.getElementById("phone").value.trim();
    let dob=document.getElementById("dob").value;
    let course=document.getElementById("course").value;
    let address=document.getElementById("address").value.trim();

    let gender=document.querySelector('input[name="gender"]:checked');

    // Name Validation
    if(name==""){
        document.getElementById("nameError").innerHTML="Student name is required.";
        valid=false;
    }

    // Father Validation
    if(father==""){
        document.getElementById("fatherError").innerHTML="Father's name is required.";
        valid=false;
    }

    // Mother Validation
    if(mother==""){
        document.getElementById("motherError").innerHTML="Mother's name is required.";
        valid=false;
    }

    // Email Validation
    let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(email==""){
        document.getElementById("emailError").innerHTML="Email is required.";
        valid=false;
    }
    else if(!emailPattern.test(email)){
        document.getElementById("emailError").innerHTML="Enter a valid email address.";
        valid=false;
    }

    // Phone Validation
    let phonePattern=/^[0-9]{10}$/;

    if(phone==""){
        document.getElementById("phoneError").innerHTML="Phone number is required.";
        valid=false;
    }
    else if(!phonePattern.test(phone)){
        document.getElementById("phoneError").innerHTML="Phone number must be exactly 10 digits.";
        valid=false;
    }

    // Gender Validation
    if(!gender){
        document.getElementById("genderError").innerHTML="Please select your gender.";
        valid=false;
    }

    // DOB Validation
    if(dob==""){
        document.getElementById("dobError").innerHTML="Date of birth is required.";
        valid=false;
    }

    // Course Validation
    if(course==""){
        document.getElementById("courseError").innerHTML="Please select a course.";
        valid=false;
    }

    // Address Validation
    if(address==""){
        document.getElementById("addressError").innerHTML="Address is required.";
        valid=false;
    }

    // Success
    if(valid){
        document.getElementById("message").innerHTML="✅ Student Registered Successfully!";
        document.getElementById("registrationForm").reset();
    }

});

// Dark Mode Toggle
function toggleMode(){

    document.body.classList.toggle("dark-mode");

    let btn = document.getElementById("toggleBtn");

    if(document.body.classList.contains("dark-mode")){
        btn.innerHTML = "☀️ Light Mode";
    }
    else{
        btn.innerHTML = "🌙 Dark Mode";
    }

}

</script>

</body>
</html>
