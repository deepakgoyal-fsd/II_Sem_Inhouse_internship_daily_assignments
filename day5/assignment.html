<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Directory — jQuery Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10111d;
    --bg-2: #171929;
    --card: #1b1d30;
    --card-border: #2a2d47;
    --teal: #2dd4bf;
    --coral: #fb7185;
    --violet: #a78bfa;
    --text: #eef0fb;
    --text-dim: #8d90ad;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(45,212,191,0.10), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(167,139,250,0.10), transparent 45%),
      var(--bg);
    font-family:'Inter', sans-serif;
    color:var(--text);
    padding:48px 24px 80px;
  }
  .wrap{ max-width:1100px; margin:0 auto; }
  header{ margin-bottom:36px; opacity:0; animation: rise .6s ease forwards; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--teal); display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .eyebrow::before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--teal); box-shadow:0 0 10px var(--teal); }
  h1{
    font-family:'Sora', sans-serif; font-weight:800; font-size:34px; margin:0 0 6px;
    letter-spacing:-0.02em;
  }
  header p{ color:var(--text-dim); margin:0; font-size:15px; max-width:520px; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:20px;
  }
  .card{
    background:linear-gradient(180deg, var(--card), #17182a);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:20px;
    opacity:0;
    transform:translateY(10px);
  }
  .card.fade-in{ animation: rise .55s ease forwards; }

  .top{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .avatar{
    width:46px; height:46px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora', sans-serif; font-weight:700; font-size:16px;
    color:#0d0e18; flex-shrink:0;
  }
  .name{ font-family:'Sora', sans-serif; font-weight:700; font-size:15.5px; }
  .meta{ color:var(--text-dim); font-size:12.5px; margin-top:2px; }

  .tags{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tag{
    font-family:'JetBrains Mono', monospace; font-size:10.5px;
    padding:3px 8px; border-radius:20px;
    background:rgba(255,255,255,0.05); border:1px solid var(--card-border);
    color:var(--text-dim);
  }

  .btn-details{
    width:100%; padding:10px 0; border:none; border-radius:10px;
    background:var(--teal); color:#0a1f1c;
    font-family:'Inter', sans-serif; font-weight:600; font-size:13.5px;
    cursor:pointer; transition: transform .15s ease;
  }
  .btn-details:hover{ transform:translateY(-1px); }
  .btn-details:active{ transform:translateY(0); }
  .btn-details:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }

  .details{
    display:none;
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--card-border);
    font-size:13px;
    color:var(--text-dim);
    line-height:1.6;
  }
  .details .row{ display:flex; justify-content:space-between; margin-bottom:6px; }
  .details .row b{ color:var(--text); font-weight:500; }
  .details .bio{ margin-top:8px; color:var(--text); }

  footer{
    margin-top:44px; text-align:center; color:var(--text-dim);
    font-family:'JetBrains Mono', monospace; font-size:11.5px;
  }

  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .card, header{ animation:none !important; opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    
    <h1>Student Directory</h1>
    
  </header>

  <div class="grid" id="grid"></div>

  <footer>tanish</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
const palette = ['#2dd4bf', '#fb7185', '#a78bfa', '#fbbf24', '#60a5fa'];

const students = [
  { name:"Aarav Sharma", major:"CSE", year:"1st Year", tags:["React","Python"], email:"aarav.s@college.edu", gpa:"8.7", bio:"Building a poll app on the side. Loves clean UI." },
  { name:"Isha Verma", major:"ECE", year:"2nd Year", tags:["Arduino","C++"], email:"isha.v@college.edu", gpa:"9.1", bio:"IoT enthusiast, currently prototyping a soil sensor." },
  { name:"Kabir Nair", major:"CSE", year:"1st Year", tags:["MySQL","PHP"], email:"kabir.n@college.edu", gpa:"8.2", bio:"Interning on a submission portal backend." },
  { name:"Meera Iyer", major:"IT", year:"3rd Year", tags:["Node","AWS"], email:"meera.i@college.edu", gpa:"8.9", bio:"Deploys side projects every weekend." },
  { name:"Rohan Kapoor", major:"CSE", year:"2nd Year", tags:["jQuery","CSS"], email:"rohan.k@college.edu", gpa:"7.8", bio:"Front-end tinkerer, animation nerd." },
  { name:"Tanvi Rao", major:"AI/ML", year:"1st Year", tags:["Pandas","SQL"], email:"tanvi.r@college.edu", gpa:"9.4", bio:"Training small models between lectures." },
];

function initials(name){
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

const $grid = $('#grid');

students.forEach((s, i) => {
  const color = palette[i % palette.length];
  const $card = $(`
    <div class="card">
      <div class="top">
        <div class="avatar" style="background:${color}">${initials(s.name)}</div>
        <div>
          <div class="name">${s.name}</div>
          <div class="meta">${s.major} · ${s.year}</div>
        </div>
      </div>
      <div class="tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <button class="btn-details">Show Details</button>
      <div class="details">
        <div class="row"><span>Email</span><b>${s.email}</b></div>
        <div class="row"><span>GPA</span><b>${s.gpa}</b></div>
        <p class="bio">${s.bio}</p>
      </div>
    </div>
  `);
  $grid.append($card);
});


$('.card').each(function(i){
  const $c = $(this);
  setTimeout(() => $c.addClass('fade-in'), i * 70);
});


$grid.on('click', '.btn-details', function(){
  const $btn = $(this);
  const $details = $btn.closest('.card').find('.details');
  const isOpening = $btn.text().trim() === 'Show Details';

  $details.slideToggle(280);

  $btn.text(isOpening ? 'Hide Details' : 'Show Details');

  $btn.css('background', isOpening ? '#fb7185' : '#2dd4bf');
  $btn.css('color', isOpening ? '#2a0d12' : '#0a1f1c');
});
</script>

</body>
</html>
