<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>

<body>

<h1 align="center">Student Registration</h1>

<form>

<table align="center" border="1" cellpadding="12">

<tr>
    <td>Name</td>
    <td><input type="text" placeholder="Enter Name"></td>
</tr>

<tr>
    <td>Email</td>
    <td><input type="email" placeholder="Enter Email"></td>
</tr>

<tr>
    <td>Phone</td>
    <td><input type="tel" placeholder="Enter Phone Number"></td>
</tr>

<tr>
    <td>Date of Birth</td>
    <td><input type="date"></td>
</tr>

<tr>
    <td>Gender</td>
    <td>
        <input type="radio" name="g"> Male
        <input type="radio" name="g"> Female
    </td>
</tr>

<tr>
    <td>Department</td>
    <td>
        <select>
            <option>Select Department</option>
            <option>CSE</option>
            <option>IT</option>
            <option>ECE</option>
            <option>Mechanical</option>
            <option>Civil</option>
        </select>
    </td>
</tr>

<tr>
    <td>Password</td>
    <td><input type="password"></td>
</tr>

<tr>
    <td>Confirm Password</td>
    <td><input type="password"></td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </td>
</tr>

</table>

</form>

</body>
</html>
